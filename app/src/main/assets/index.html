<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>BookTalk</title>
<style>
:root{
  --bg:#000; --s1:#0f0f12; --s2:#18181d; --s3:#23232a; --line:#2b2b33;
  --tx:#f1eee8; --tx2:#a9a6a0; --tx3:#6f6c68;
  --ac:#ff8a5c; --ac2:#ffb38f; --acbg:rgba(255,138,92,.14);
  --ok:#5fd39a; --warn:#ffcc66; --bad:#ff6b6b;
  --r:16px; --serif:Georgia,"Noto Serif","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --read:19px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{resize:vertical;min-height:84px;line-height:1.4}
svg{width:22px;height:22px;fill:currentColor;flex:none}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.view{flex:1;overflow-y:auto;padding:0 16px 150px;display:none}
.view.on{display:block}
header.top{display:flex;align-items:center;gap:10px;padding:18px 2px 12px;position:sticky;top:0;background:linear-gradient(var(--bg) 75%,transparent);z-index:5}
header.top h1{font-size:26px;margin:0;font-weight:750;letter-spacing:-.5px;flex:1}
header.top h1 b{color:var(--ac)}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--s2)}
.iconbtn:active{background:var(--s3)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--tx3);margin:24px 2px 10px;font-weight:650}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--tx2)} .small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--s3);border-radius:999px;padding:11px 18px;font-weight:600}
.btn.pri{background:var(--ac);color:#1b0d05}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn:active{filter:brightness(1.15)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--acbg);border-color:var(--ac);color:var(--ac2)}

/* library */
.empty{text-align:center;padding:60px 20px;color:var(--tx2)}
.empty .big{font-size:54px;margin-bottom:10px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px 14px}
.book{display:flex;flex-direction:column;gap:7px;text-align:left}
.cover{aspect-ratio:2/3;border-radius:10px;overflow:hidden;position:relative;background:var(--s2);box-shadow:0 6px 20px rgba(0,0,0,.6)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.gencover{position:absolute;inset:0;padding:14px 12px;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--serif)}
.gencover .t{font-size:17px;font-weight:700;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.gencover .a{font-size:12px;opacity:.8}
.gencover .f{font-family:var(--sans);font-size:10px;letter-spacing:1.5px;opacity:.6;text-transform:uppercase}
.book .bt{font-weight:650;font-size:14px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.book .ba{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:4px;background:var(--s3);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ac)}
.fab{position:fixed;right:18px;bottom:calc(84px + var(--mini,0px));width:60px;height:60px;border-radius:20px;background:var(--ac);color:#1b0d05;display:grid;place-items:center;box-shadow:0 8px 24px rgba(255,138,92,.35);z-index:20}
.fab svg{width:30px;height:30px}

/* tabs + mini */
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(10,10,12,.96);border-top:1px solid var(--line);z-index:30;padding-bottom:4px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;color:var(--tx3);font-size:11px;font-weight:600}
nav.tabs button.on{color:var(--ac)}
#mini{position:fixed;left:8px;right:8px;bottom:68px;background:var(--s2);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;z-index:29}
#mini .mt{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .ms{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* book page */
.bhead{display:flex;gap:16px;align-items:flex-end;margin-top:6px}
.bhead .cover{width:118px;flex:none}
.bhead h3{font-family:var(--serif);font-size:23px;margin:0 0 4px;line-height:1.15}
.anal{margin-top:16px}
.anal .g{font-weight:650;margin-bottom:4px}
.moods{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.moods::-webkit-scrollbar{display:none}
.chlist .ch{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.chlist .ch:last-child{border:0}
.chlist .ch .n{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chlist .ch.off .n{color:var(--tx3);text-decoration:line-through}
.chlist .ch .why{font-size:11px;color:var(--tx3)}
.tog{width:44px;height:26px;border-radius:13px;background:var(--s3);position:relative;flex:none;transition:.2s}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#888;transition:.2s}
.tog.on{background:var(--ac)} .tog.on::after{left:21px;background:#fff}

/* player */
#player{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s ease}
#player.on{transform:none}
#player .ph{display:flex;align-items:center;gap:8px;padding:12px 10px 8px}
#player .ph .tt{flex:1;min-width:0;text-align:center}
#player .ph .tt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#reader{flex:1;overflow-y:auto;padding:10px 22px 40vh;font-family:var(--serif);font-size:var(--read);line-height:1.62;color:#8d8a85}
#reader p{margin:0 0 .85em;transition:color .25s;border-radius:6px}
#reader p.h{font-weight:700;color:#bdb9b2;font-size:1.15em;margin:1.2em 0 .8em}
#reader p.sc{text-align:center;letter-spacing:.6em;color:var(--tx3)}
#reader{position:relative}
#reader p.cur{color:var(--tx)}
#reader p.done .w{color:inherit}
#reader p.done{color:#57544f}
#moodRow,.moodrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 10px}
#moodRow::-webkit-scrollbar,.moodrow::-webkit-scrollbar{display:none}
.mb{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:7px 6px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-size:11px;font-weight:600;color:var(--tx2)}
.mb span{font-size:20px;line-height:1}
.mb.on{background:var(--acbg);border-color:var(--ac);color:var(--ac2)}
#pctl{padding:10px 16px 18px;background:linear-gradient(transparent,var(--bg) 22%);border-top:1px solid var(--line)}
.seek{width:100%;accent-color:var(--ac);padding:0;border:0;background:none;height:24px}
.ctl{display:flex;align-items:center;justify-content:space-between;margin:8px 4px 12px}
.ctl .iconbtn{background:transparent;width:48px;height:48px}
.ctl .iconbtn svg{width:28px;height:28px}
.ctl .play{width:72px;height:72px;border-radius:50%;background:var(--ac);color:#1b0d05;display:grid;place-items:center}
.ctl .play svg{width:38px;height:38px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.timeinfo{display:flex;justify-content:space-between;font-size:12px;color:var(--tx3)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tx3);display:inline-block}
.dot.g{background:var(--ok)} .dot.s{background:var(--warn)} .dot.l{background:var(--ac);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;opacity:0;pointer-events:none;transition:.2s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--s1);border-radius:22px 22px 0 0;border-top:1px solid var(--line);z-index:81;padding:8px 18px 26px;transform:translateY(105%);transition:transform .25s ease}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--s3);margin:4px auto 12px}
#sheet h4{margin:4px 0 14px;font-size:19px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.opt:last-child{border:0}
.opt.on{color:var(--ac2)}
.opt .ic{font-size:22px;width:30px;text-align:center}
label.f{display:block;font-size:12px;color:var(--tx2);margin:14px 2px 6px;font-weight:600}
.slider{display:flex;align-items:center;gap:10px}
.slider input{flex:1;padding:0;border:0;background:none;accent-color:var(--ac)}
.slider output{width:44px;text-align:right;font-variant-numeric:tabular-nums;color:var(--tx2)}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--s3);color:var(--tx)}
.set{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.moodcard{display:flex;gap:12px;align-items:flex-start;padding:14px;margin-bottom:10px}
.moodcard .ic{font-size:28px;line-height:1}
.moodcard .st{font-size:13px;color:var(--tx2);margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

#busy{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px}
.spin{width:42px;height:42px;border:4px solid var(--s3);border-top-color:var(--ac);border-radius:50%;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);background:#2a2a31;color:var(--tx);padding:11px 16px;border-radius:12px;z-index:120;opacity:0;transition:.25s;max-width:88vw;font-size:14px;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
#sheet.on ~ #toast{top:calc(env(safe-area-inset-top) + 24px);bottom:auto}
a{color:var(--ac2)}
.sect{margin:10px 2px 4px}.sect b{font-size:15px}
</style>
</head>
<body>
<div id="app">
  <!-- LIBRARY -->
  <section class="view on" id="v-library">
    <header class="top"><h1>Book<b>Talk</b></h1></header>
    <div id="libList"></div>
  </section>

  <!-- BOOK PAGE -->
  <section class="view" id="v-book">
    <header class="top">
      <button class="iconbtn" data-act="back"><svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z"/></svg></button>
      <button class="iconbtn" data-act="home" title="Home"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
      <div class="grow"></div>
      <button class="iconbtn" id="bkDelete" title="Delete"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg></button>
    </header>
    <div id="bookBody"></div>
  </section>

  <!-- VOICES -->
  <section class="view" id="v-voices">
    <header class="top"><h1>Narrators</h1></header>
    <p class="muted small" style="margin-top:0">Tap ▶ to hear someone's real voice, or <b>Hear them read</b> to hear them reading a book in the mood you pick. Tap <b>Use</b> to make them the narrator for new books. You can give each book its own narrator from the book page or the player.</p>
    <div id="narrList"></div>
  </section>

  <!-- SETTINGS -->
  <section class="view" id="v-settings">
    <header class="top"><h1>Settings</h1></header>
    <div id="setBody"></div>
  </section>
</div>

<button class="fab" id="fab" title="Add a book"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></button>
<input type="file" id="fileIn" class="hidden" accept=".epub,.pdf,.txt,.text,.md,.html,.htm,.xhtml,.fb2,.docx,.mobi,.azw,.azw3,.prc,.pdb,.zip,application/epub+zip,application/pdf,text/plain">

<div id="mini" class="hidden">
  <div class="grow" id="miniOpen"><div class="mt" id="miniT"></div><div class="ms" id="miniS"></div></div>
  <button class="iconbtn" id="miniPlay"></button>
</div>

<nav class="tabs">
  <button data-tab="library" class="on"><svg viewBox="0 0 24 24"><path d="M4 6H2v14a2 2 0 0 0 2 2h14v-2H4zm16-4H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2m-1 9h-10V9h10zm-4 4H9v-2h6zm4-8H9V5h10z"/></svg>Library</button>
  <button data-tab="voices"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3m5.3-3A5.3 5.3 0 0 1 12 16.1 5.3 5.3 0 0 1 6.7 11H5a7 7 0 0 0 6 6.7V21h2v-3.3a7 7 0 0 0 6-6.7z"/></svg>Narrators</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7"/></svg>Settings</button>
</nav>

<!-- PLAYER -->
<section id="player">
  <div class="ph">
    <button class="iconbtn" id="plClose"><svg viewBox="0 0 24 24"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg></button>
    <div class="tt"><div style="font-weight:650" id="plTitle"></div><div class="small muted" id="plChap"></div></div>
    <button class="iconbtn" id="plHome" title="Home"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
    <button class="iconbtn" id="plChapters"><svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3zm0 4h2v-2H3zm0-8h2V7H3zm4 4h14v-2H7zm0 4h14v-2H7zM7 7v2h14V7z"/></svg></button>
  </div>
  <div id="reader"></div>
  <div id="pctl">
    <input type="range" class="seek" id="seek" min="0" max="100" value="0">
    <div class="timeinfo"><span id="tiLeft"></span><span id="tiRight"></span></div>
    <div class="ctl">
      <button class="iconbtn" id="cPrevCh" title="Previous chapter"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="iconbtn" id="cPrev" title="Back"><svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6zm.5-6 8.5 6V6z"/></svg></button>
      <button class="play" id="cPlay"></button>
      <button class="iconbtn" id="cNext" title="Forward"><svg viewBox="0 0 24 24"><path d="m4 18 8.5-6L4 6zm9-12v12l8.5-6z"/></svg></button>
      <button class="iconbtn" id="cNextCh" title="Next chapter"><svg viewBox="0 0 24 24"><path d="m6 18 8.5-6L6 6zM16 6v12h2V6z"/></svg></button>
    </div>
    <div id="moodRow"></div>
    <div class="chips">
      <button class="chip" id="chMood"></button>
      <button class="chip" id="chSpeed"></button>
      <button class="chip" id="chSleep"></button>
      <button class="chip" id="chEngine"></button>
    </div>
  </div>
</section>

<div id="scrim"></div>
<div id="sheet"></div>
<div id="busy" class="hidden"><div class="spin"></div><div id="busyT" style="font-weight:650"></div><div id="busyS" class="small muted"></div></div>
<div id="toast"></div>

<script src="jszip.min.js"></script>
<script src="pdf.min.js"></script>
<script>
'use strict';
/* ================================================================
   BookTalk — load an ebook, keep only the story, read it aloud.
   ================================================================ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const NATIVE = window.BookTalkNative || null;
const HEAD = '\u0001', SCENE = '\u0002';

const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>',
};

function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms);
}
function busy(title, sub = '') {
  const b = $('#busy');
  if (title === false) { b.classList.add('hidden'); return; }
  b.classList.remove('hidden'); $('#busyT').textContent = title; $('#busyS').textContent = sub;
}

/* ---------------- Storage ---------------- */
const DB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('booktalk', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('meta', { keyPath: 'id' });
        d.createObjectStore('content', { keyPath: 'id' });
      };
      r.onsuccess = () => res(this.db = r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async run(store, mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode), req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  get(s, id) { return this.run(s, 'readonly', o => o.get(id)); },
  put(s, v) { return this.run(s, 'readwrite', o => o.put(v)); },
  del(s, id) { return this.run(s, 'readwrite', o => o.delete(id)); },
  all(s) { return this.run(s, 'readonly', o => o.getAll()); },
};
const LS = {
  get(k, d) { try { const v = localStorage.getItem('bt.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('bt.' + k, JSON.stringify(v)); } catch {} },
};

/* ---------------- Settings & moods ---------------- */
const DEFAULT_SETTINGS = {
  engine: 'auto',            // auto = Gemini with built-in fallback | gemini | system
  apiKey: '',
  fishKey: '',
  gemLong: true,
  gemChain: true,
  fishModel: 's2.1-pro-free',
  ttsModel: 'gemini-3.1-flash-tts-preview',
  textModel: 'gemini-2.5-flash',
  narrator: 'anna',     // default narrator for new books
  sysVoice: '',
  sysEngine: '',
  offline: 'android',   // offline voice: 'android' (phone's TTS) or 'kokoro' (built into BookTalk)
  kokVoice: 18,         // Kokoro speaker id; 18 = Puck
  speed: 1,
  skipMatter: true,
  readSize: 19,
  autoScroll: true,
  prefetch: 3,
};
let S = Object.assign({}, DEFAULT_SETTINGS, LS.get('settings', {}));
const saveSettings = () => LS.set('settings', S);
if (!S.deepPrefetch) { S.deepPrefetch = true; S.prefetch = Math.max(S.prefetch || 0, 8); saveSettings(); }   // prepare further ahead to avoid pauses

const GEMINI_VOICES = [

async function parseEpub(buf, onStage) {

async function parseBook(file, onStage) {

    if (zip.file('META-INF/container.xml') || ext === 'epub') book = await parseEpub(buf, onStage);
    else if (zip.file('word/document.xml')) book = await parseDocx(zip);
    else {
      const fb = Object.values(zip.files).find(f => /\.fb2$/i.test(f.name));
      const ep = Object.values(zip.files).find(f => /\.epub$/i.test(f.name));
      if (fb) book = parseFb2(await fb.async('string'));
      else if (ep) book = await parseEpub(await ep.async('arraybuffer'), onStage);

    }
  }
  else if (/BOOKMOBI|TEXtREAd/.test(head.slice(60, 68)) || ['mobi', 'azw', 'azw3', 'prc', 'pdb'].includes(ext)) book = parseMobi(buf);
  else if (ext === 'fb2' || /<FictionBook/.test(new TextDecoder().decode(new Uint8Array(buf.slice(0, 600))))) book = parseFb2(decodeBytes(new Uint8Array(buf)));
  else if (['html', 'htm', 'xhtml'].includes(ext) || /^\s*<(!doctype html|html)/i.test(head)) book = parseHtml(buf);
  else book = parseTxt(buf);

  if (/^(untitled|unknown|anonymous|document\d*|microsoft word.*|.*\.(docx?|pdf|indd))$/i.test((book.title || '').trim())) book.title = '';
  if (/^(unknown|anonymous|administrator|user|owner)$/i.test((book.author || '').trim())) book.author = '';
  book.title = cleanText(book.title || '').replace(/\n/g, ' ') || file.name.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ');
  book.author = cleanText(book.author || '').replace(/\n/g, ' ');
  book.chapters = (book.chapters || []).filter(c => c.paras && c.paras.length);
  if (!book.chapters.length) throw new Error('No readable text found in this book.');
  book.format = (head.startsWith('%PDF') ? 'pdf' : ext || 'text').toUpperCase();

}

const MAX_UNIT = 650;
function splitSentences(t, max) {
  const sents = t.match(/[^.!?…]+(?:[.!?…]+["'”’)\]]*\s*|$)/g) || [t];
  const out = []; let cur = '';
  for (const s of sents) {
    if (cur && (cur + s).length > max) { out.push(cur.trim()); cur = ''; }
    if (s.length > max) { for (let i = 0; i < s.length; i += max) out.push(s.slice(i, i + max)); continue; }
    cur += s;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}
function buildUnits(paras, max = MAX_UNIT) {
  const units = []; let cur = null, long = max > MAX_UNIT;
  const flush = () => { if (cur) units.push(cur); cur = null; };
  const add = (i, t) => { if (cur && cur.text.length + t.length + 1 <= max) { cur.text += '\n' + t; cur.p1 = i; } else { flush(); cur = { p0: i, p1: i, text: t }; } };
  paras.forEach((raw, i) => {
    if (raw === SCENE) { if (long) { if (cur) cur.p1 = i; return; } flush(); units.push({ p0: i, p1: i, scene: true, text: '' }); return; }
    if (raw[0] === HEAD) { const t = raw.slice(1), ht = /[.!?:]$/.test(t) ? t : t + '.'; if (long) { add(i, ht); return; } flush(); units.push({ p0: i, p1: i, head: true, text: ht }); return; }

    add(i, raw);
  });

  return units;
}

/* Events from Android (TTS/audio callbacks, notification & headset buttons) */
function onNative(ev) {
  if (typeof ev === 'string') { try { ev = JSON.parse(ev); } catch { return; } }
  switch (ev.type) {
    case 'done': if (ev.id === Preview.id) Preview.done(); else if (ev.id?.[0] === 'q') P.phoneEvent('done', ev.id); else P.onDone(ev.id); break;
    case 'error': if (ev.id === Preview.id) { Preview.done(); toast('Voice error: ' + (ev.msg || '')); } else if (ev.id?.[0] === 'q') P.phoneEvent('error', ev.id, ev.msg); else P.onError(ev.id, ev.msg); break;
    case 'voices': Phone.refresh(); if ($('#narrList')?.offsetParent) renderNarrators(); break;
    case 'kokinst': if (ev.pack === 'pocket') Pocket.onInstall(ev); break;
    case 'kokprep': case 'export': case 'http': Maker.onNative(ev); break;
    case 'start': if (ev.id?.[0] === 'q') P.phoneEvent('start', ev.id); Sync.start(ev.id, ev.dur); if (ev.id === P.curId) setStatus('reading'); if (ev.id === Preview.id) Preview.started(); break;
    case 'range': Sync.range(ev.id, ev.start); break;
    case 'tuning': if (ev.on) { toast('Getting the narrator ready for this phone (one time, about 20 seconds)…', 8000); setStatus('loading'); } else toast('All set. Speech should now flow smoothly.'); break;
    case 'media':
      if (ev.action === 'toggle') P.toggle();
      else if (ev.action === 'play') P.play();
      else if (ev.action === 'pause') P.pause();
      else if (ev.action === 'next') P.jump(P.u + 1);
      else if (ev.action === 'prev') P.jump(P.u - 1);
      else if (ev.action === 'stop') { P.close(); }
      break;
  }
}

    if (!icon) { Out.stop(); if (P.playing) P.pause(); Narr.stopSample(); }
    this.done();
    if (Phone.is(narId)) {
      const id = this.id = 'pv' + uid(), n = Phone.get(narId), md = moodOf(moodId);
      this.btn = btn; this.icon = icon || null;
      if (btn) { btn.disabled = true; btn.dataset.l = btn.textContent; btn.textContent = 'Playing…'; }
      Out.phoneSay(id, SAMPLE, clamp(1 + (md.pitch - 1) * 2, 0.5, 2), clamp(S.speed * md.pace, 0.5, 2.5), n.tts, 0, true);
      return;
    }
    if (!Pocket.refresh()) { voicePackSheet(); return; }
    const id = this.id = 'pv' + uid(), n = Narr.get(narId);
    this.btn = btn; if (btn) { btn.disabled = true; btn.dataset.l = btn.textContent; btn.textContent = 'Preparing…'; }
    try {
      await Narr.ensure(n.id);
      if (this.id !== id) return;
      const md = moodOf(moodId);
      NATIVE.clonePlay(id, Pocket.key(SAMPLE, n.voice, md.temp), SAMPLE, n.voice, md.temp, clamp(S.speed * md.pace, 0.5, 2.5), md.pitch, 0);
    } catch (e) { toast('Preview failed: ' + (e.message || e)); this.done(); }
  },
  started() { if (this.btn) this.btn.textContent = 'Playing…'; },
  done() { if (this.icon) { this.icon.dataset.on = ''; this.icon.innerHTML = ICON.play; this.icon = null; } if (this.btn) { this.btn.disabled = false; this.btn.textContent = this.btn.dataset.l || 'Hear them read'; } this.btn = null; this.id = null; },
};

/* ---------------- Save a whole book as an audiobook ---------------- */
const Maker = {
  job: null, pend: new Map(),
  plan(meta, content) {
    return meta.include.map((on, i) => on ? i : -1).filter(i => i >= 0)
      .map((ch, n) => ({ ch, n, title: content.chapters[ch].title, units: buildUnits(content.chapters[ch].paras, MAX_UNIT) }));
  },
  keyFor(meta, text) { return Pocket.key(text, Narr.forBook(meta).voice, moodOf(meta.mood).temp); },
  statusText() { const j = this.job; if (!j) return ''; return j.state === 'paused' ? 'paused · ' + j.pct + '%' : j.state === 'done' ? 'done' : `${j.pct}% · chapter ${j.chNow}/${j.chTotal}`; },
  async sheet(meta) {
    meta = (await DB.get('meta', meta.id)) || meta;   // always use the latest narrator/mood
    const content = await DB.get('content', meta.id);
    if (this.job && this.job.id === meta.id && this.job.state === 'running') {
      openSheet(`<h4>Saving as audiobook</h4><div class="small muted" id="mkSt">${esc(this.job.msg || '')}</div><div class="prog" style="margin:12px 0"><i id="mkBar" style="width:${this.job.pct}%"></i></div>
        <p class="small muted">Chapters are saved to <b>Music/BookTalk/${esc(AudioName(meta.title))}</b> as they finish. You can leave this screen; keep BookTalk open in the background.</p>
        <button class="btn ghost block" id="mkStop">Stop (you can continue later)</button>`, sh => { $('#mkStop', sh).onclick = () => { this.stop(); closeSheet(); }; });
      return;
    }
    if (this.job && this.job.state === 'running') { toast('Already saving “' + this.job.title + '”. One book at a time.'); return; }
    if (Narr.forBook(meta).phone) { openSheet(`<h4>Save as audiobook</h4><p class="muted" style="margin-top:0">Audiobook files are made with the AI narrators. This book uses a phone voice, which reads live and can't be saved as a file.</p><p class="small muted">To save one, change this book's narrator to an AI narrator first.</p><button class="btn block" onclick="closeSheet()">OK</button>`); return; }
    if (!Pocket.refresh()) { voicePackSheet(); return; }
    const n = Narr.forBook(meta), plan = this.plan(meta, content);
    const units = plan.reduce((a, c) => a + c.units.filter(u => !u.scene).length, 0);
    const done = plan.reduce((a, c) => a + c.units.filter(u => !u.scene && NATIVE.cacheHas(this.keyFor(meta, u.text))).length, 0);
    const hours = meta.words / 155 / 60;
    openSheet(`<h4>Save as audiobook</h4>
      <p class="small muted" style="margin-top:0">Makes the whole book and saves it as audio files, one per chapter, in <b>Music/BookTalk/${esc(AudioName(meta.title))}</b>. They play in any music or podcast app and can be copied anywhere.</p>
      <div class="card"><b>🗣️ ${esc(n.name)}</b> <span class="small muted">· ${esc(n.desc)} · ${moodOf(meta.mood).icon} ${moodOf(meta.mood).name}</span>
        <div class="small muted" style="margin-top:6px">${plan.length} chapters · about ${hours >= 1 ? hours.toFixed(1) + ' hours' : Math.round(hours * 60) + ' min'} of audio${done ? ` · ${Math.round(done / Math.max(1, units) * 100)}% already made` : ''}</div></div>
      <p class="small muted">Free, made on this phone. A whole book takes hours, so start it with the phone on charge (overnight is ideal). To use a different narrator or mood, change it on the book page first.</p>
      <button class="btn pri block" id="mkGo">${LS.get('make.' + meta.id, null) ? 'Continue' : 'Start'}</button>`, sh => {
      $('#mkGo', sh).onclick = () => { closeSheet(); this.run(meta, content); };
    });
  },
  stop() { if (this.job) { this.job.cancel = true; this.job.state = 'paused'; this.job.msg = 'Stopped'; } NATIVE?.kokoroCancel?.(); },
  call(kind, ...args) {
    return new Promise((res, rej) => {
      const id = 'm' + uid();
      this.pend.set(id, { res, rej });
      NATIVE[kind](id, ...args);
    });
  },
  onNative(ev) {
    const p = this.pend.get(ev.reqId); if (!p) return;
    this.pend.delete(ev.reqId);
    ev.ok ? p.res(ev) : p.rej(Object.assign(new Error(ev.msg || 'failed'), { cancelled: ev.msg === 'cancelled' }));
  },
  gen(meta, text, key) { return this.call('clonePrepare', key, text, Narr.forBook(meta).voice, moodOf(meta.mood).temp); },
  update() {
    const j = this.job; if (!j) return;
    j.pct = Math.floor(j.done / Math.max(1, j.total) * 100);
    const st = $('#mkSt'), bar = $('#mkBar'), btn = $('#bkMake');
    if (st) st.textContent = j.msg; if (bar) bar.style.width = j.pct + '%';
    if (btn && bookPageId === j.id) btn.textContent = '🎧 Audiobook: ' + this.statusText();
    if (!P.playing && j.state === 'running') Out.session(true, true, 'Saving audiobook · ' + j.pct + '%', j.title);   // keeps BookTalk awake while it works
  },
  async run(meta, content) {
    const eng = 'narrator:' + Narr.forBook(meta).id + ':' + moodOf(meta.mood).id;
    try { await Narr.ensure(Narr.forBook(meta).id); } catch (e) { toast('Couldn\'t get the narrator\'s voice. Check your internet connection.', 5000); return; }
    const plan = this.plan(meta, content);
    const saved = LS.get('make.' + meta.id, null);
    const exported = new Set(saved && saved.eng === eng ? saved.exported : []);
    const j = this.job = { id: meta.id, title: meta.title, eng, state: 'running', done: 0, total: plan.reduce((a, c) => a + c.units.filter(u => !u.scene).length, 0), chNow: 0, chTotal: plan.length, pct: 0, msg: 'Starting…' };
    LS.set('make.' + meta.id, { eng, exported: [...exported] });
    toast('Saving “' + meta.title + '” as an audiobook. You can keep using the app.', 4000);
    let where = '';
    try {
      for (const c of plan) {
        j.chNow = c.n + 1;
        const items = [];
        for (const u of c.units) {
          if (j.cancel) return;
          if (u.scene) { items.push({ gap: 1200 }); continue; }
          const key = this.keyFor(meta, u.text);
          if (!exported.has(c.ch) && !NATIVE.cacheHas(key)) {
            j.msg = `Chapter ${c.n + 1} of ${plan.length}: ${c.title}`; this.update();
            for (let attempt = 0; ; attempt++) {
              try { await this.gen(meta, u.text, key); break; }
              catch (e) {
                if (j.cancel) return;
                if (e.cancelled && attempt < 50) { await sleep(1500); continue; }   // listening took priority; try again
                if (attempt < 3) { await sleep(4000); continue; }
                throw e;
              }
            }
          }
          j.done++;
          items.push({ k: key, gap: u.head ? 800 : 300 });
          this.update();
        }
        if (exported.has(c.ch)) continue;
        j.msg = `Saving chapter ${c.n + 1} of ${plan.length}…`; this.update();
        const ev = await this.call('exportChapter', meta.title, `${String(c.n + 1).padStart(2, '0')} - ${c.title}`, JSON.stringify(items), moodOf(meta.mood).pitch);
        where = ev.where; exported.add(c.ch);
        LS.set('make.' + meta.id, { eng, exported: [...exported] });
      }
      j.state = 'done'; j.done = j.total; j.msg = 'Finished'; this.update();
      LS.set('make.' + meta.id, null); localStorage.removeItem('bt.make.' + meta.id);
      openSheet(`<h4>Audiobook saved 🎧</h4><p class="muted">“${esc(meta.title)}” is in <b>${esc(where || 'Music/BookTalk')}</b>, one file per chapter. Open it in any music, podcast or audiobook app, or copy the folder to another device.</p><button class="btn pri block" onclick="closeSheet()">Great</button>`);
    } catch (e) {
      j.state = 'paused'; j.msg = 'Stopped: ' + (e.message || e); this.update(); toast(j.msg, 6000);
    } finally {
      if (!P.playing && !P.meta) Out.session(false, false);
      else if (!P.playing && P.meta) Out.session(true, false, P.meta.title, P.chapterTitle());
      if (bookPageId === meta.id) openBook(meta.id);
    }
  },
};
/* ---------------- Get the next hour(s) ready: generate ahead in the background, play gap-free later ---------------- */
const SECS_PER_CHAR = 1 / 14.5;   // rough speech length at 1×
const Prep = {
  job: null,
  // Passages from the current position onwards, for the open book
  plan(limitSecs, chapterOnly) {
    if (!P.meta) return [];
    const inc = P.included(), out = []; let secs = 0;
    let ch = P.ch, u = P.u;
    while (true) {
      const units = P.unitsFor(ch);
      if (u >= units.length) { if (chapterOnly) break; const nx = inc.find(i => i > ch); if (nx == null) break; ch = nx; u = 0; continue; }
      const unit = units[u++];
      if (unit.scene) continue;
      out.push(unit); secs += unit.text.length * SECS_PER_CHAR;
      if (limitSecs && secs >= limitSecs) break;
    }
    return out;
  },
  // Minutes of listening already prepared, continuously from where you are
  readyMins() {
    if (!NATIVE || !P.meta || !Pocket.ready || P.isPhone()) return 0;
    let secs = 0, n = 0;
    for (const unit of this.plan(4 * 3600)) {
      if (!NATIVE.cacheHas(P.key(unit.text))) break;
      secs += unit.text.length * SECS_PER_CHAR; if (++n > 400) break;
    }
    return Math.floor(secs / 60);
  },
  fmt(mins) { return mins >= 60 ? `${Math.floor(mins / 60)} h ${String(mins % 60).padStart(2, '0')} min` : `${mins} min`; },
  async start(kind) {
    if (!Pocket.refresh()) { voicePackSheet(); return; }
    if (this.job && this.job.state === 'running') { toast('Already getting audio ready'); return; }
    const limit = kind === '1h' ? 3600 : kind === '2h' ? 7200 : 0;
    const units = this.plan(limit, kind === 'chapter');
    const v = P.narrator().voice, temp = P.mood().temp;
    const todo = units.filter(u => !NATIVE.cacheHas(Pocket.key(u.text, v, temp)));
    const total = todo.length, label = kind === '1h' ? 'the next hour' : kind === '2h' ? 'the next 2 hours' : kind === 'chapter' ? 'the rest of this chapter' : 'the rest of the book';
    if (!total) { toast(`${label[0].toUpperCase() + label.slice(1)} is already ready 🎧`); return; }
    try { await Narr.ensure(P.narrator().id); } catch { toast('Couldn\'t get the narrator\'s voice. Check your internet connection.'); return; }
    const j = this.job = { state: 'running', done: 0, total, label, title: P.meta.title, t0: Date.now(), cancel: false };
    toast(`Getting ${label} ready in the background. You can lock the phone.`, 4000);
    this.update();
    for (const u of todo) {
      if (j.cancel) break;
      const k = Pocket.key(u.text, v, temp);
      for (let attempt = 0; attempt < 60 && !NATIVE.cacheHas(k) && !j.cancel; attempt++) {
        try { await Maker.call('clonePrepare', k, u.text, v, temp); }
        catch (e) { if (!e.cancelled && attempt > 2) break; await sleep(1200); }
      }
      j.done++; this.update();
    }
    j.state = j.cancel ? 'stopped' : 'done'; this.update();
    if (!j.cancel) toast(`${label[0].toUpperCase() + label.slice(1)} is ready: ${this.fmt(this.readyMins())} of smooth listening 🎧`, 5000);
    if (!P.playing) { if (P.meta) Out.session(true, false, P.meta.title, P.chapterTitle()); else Out.session(false, false); }
  },
  stop() { if (this.job) this.job.cancel = true; NATIVE?.kokoroCancel?.(); },
  remaining() {
    const j = this.job; if (!j || !j.done) return '';
    const per = (Date.now() - j.t0) / j.done, left = Math.round(per * (j.total - j.done) / 60000);
    return left < 1 ? 'almost done' : `about ${this.fmt(left)} left`;
  },
  update() {
    const j = this.job; if (!j) return;
    const pct = Math.floor(j.done / Math.max(1, j.total) * 100);
    const txt = j.state === 'running' ? `Getting ${j.label} ready · ${pct}%${j.done ? ' · ' + this.remaining() : ''}` : j.state === 'done' ? 'Ready 🎧' : 'Stopped';
    $$('.prepStatus').forEach(el => el.textContent = txt);
    $$('.prepBar').forEach(el => el.style.width = pct + '%');
    if (j.state === 'running' && !P.playing) Out.session(true, true, txt, j.title);   // keeps BookTalk working with the screen off
    if (!P.playing) setStatus('');
  },
  sheet() {
    if (P.isPhone() && !(this.job && this.job.state === 'running')) {
      openSheet(`<h4>Nothing to get ready</h4><p class="muted" style="margin-top:0">${esc(P.narrator().name)} is one of your phone's own voices, so it starts instantly and reads straight through with no pauses.</p><p class="small muted">Getting audio ready is only needed for the AI narrators.</p><button class="btn block" onclick="closeSheet()">OK</button>`);
      return;
    }
    const ready = this.readyMins(), j = this.job, running = j && j.state === 'running';
    openSheet(`<h4>Get audio ready</h4>
      <p class="muted" style="margin-top:0">BookTalk makes the narration on this phone. Getting it ready in advance means it plays smoothly with no pauses. It carries on with the screen off; plugging in the charger is a good idea.</p>
      <div class="card small" style="margin-bottom:12px">From where you are: <b>${ready ? this.fmt(ready) + ' ready' : 'nothing ready yet'}</b> with ${esc(P.narrator().name)} (${P.mood().name}).</div>
      ${running ? `<div class="small prepStatus" style="margin-bottom:8px"></div><div class="prog" style="margin-bottom:14px"><i class="prepBar"></i></div><button class="btn ghost block" id="pgStop">Stop</button>` : `
      <button class="btn pri block" data-prep="1h" style="margin-bottom:8px">⬇️ Get the next hour ready</button>
      <div class="row"><button class="btn grow" data-prep="2h">Next 2 hours</button><button class="btn grow" data-prep="chapter">Rest of chapter</button><button class="btn grow" data-prep="book">Whole book</button></div>`}
      <p class="small muted">Prepared audio is saved, so it stays ready. Changing narrator or mood needs new audio.</p>`, sh => {
      this.update();
      $$('[data-prep]', sh).forEach(b => b.onclick = () => { closeSheet(); this.start(b.dataset.prep); });
      $('#pgStop', sh)?.addEventListener('click', () => { this.stop(); closeSheet(); toast('Stopped. Anything already made stays ready.'); });
    });
  },
};

/* ---------------- Follow-along: word highlighting + scrolling in time with the voice ---------------- */
const Sync = {
  id: null, words: [], idx: -1, t0: 0, dur: 0, len: 1, rate: 1, rng: -1, started: false, userUntil: 0,
  prepare(unit, id, rate) {
    this.words.forEach(w => { w.classList.remove('cw'); w.classList.add('rd'); });
    this.id = id; this.words = []; this.idx = -1; this.rng = -1; this.dur = 0; this.started = false; this.rate = rate || 1;
    this.len = Math.max(1, unit.text.length);
    const rd = $('#reader'), paras = P.content.chapters[P.ch].paras;
    let cum = 0;
    for (let i = unit.p0; i <= unit.p1; i++) {
      const el = rd.querySelector(`p[data-i="${i}"]`), raw = paras[i];
      if (!el || raw === SCENE) continue;
      const T = raw[0] === HEAD ? raw.slice(1) : raw;
      // offset of this paragraph's text inside the spoken unit text
      let shift = cum;
      if (unit.p0 === unit.p1 && !unit.head && unit.text.length < T.length) { const b = T.indexOf(unit.text.slice(0, 40)); shift = -(b < 0 ? 0 : b); }
      let html = '', m; const re = /(\s+)|(\S+)/g, mine = [];
      while ((m = re.exec(T))) {
        if (m[1]) { html += m[1].includes('\n') ? '<br>' : ' '; continue; }
        const o = m.index + shift;
        html += `<span class="w${o < 0 ? ' rd' : ''}" data-o="${o}">${esc(m[2])}</span>`;
      }
      el.innerHTML = html;
      el.querySelectorAll('span.w').forEach(w => { const o = +w.dataset.o; if (o >= 0 && o < this.len + 1) mine.push(w); });
      this.words.push(...mine);
      cum += T.length + 1 + (raw[0] === HEAD && !/[.!?:]$/.test(T) ? 1 : 0);
    }
  },
  start(id, dur) {
    if (id !== this.id || this.started) return;
    this.started = true; this.t0 = performance.now();
    this.dur = dur > 0 ? dur : this.len / (14.5 * this.rate) * 1000; // estimate for the built-in voice
  },
  range(id, start) { if (id === this.id) { this.rng = start; if (!this.started) this.start(id, -1); } },
  offset() {
    if (this.rng >= 0) return this.rng;
    if (!this.started) return -1;
    return clamp((performance.now() - this.t0) / this.dur, 0, 1) * this.len;
  },
  tick() {
    requestAnimationFrame(() => Sync.tick());
    if (!P.playing || !this.words.length || !$('#player').classList.contains('on')) return;
    const off = this.offset(); if (off < 0) return;
    let i = this.idx;
    while (i + 1 < this.words.length && +this.words[i + 1].dataset.o <= off) i++;
    if (i === this.idx || i < 0) return;
    for (let k = Math.max(0, this.idx); k < i; k++) { this.words[k].classList.remove('cw'); this.words[k].classList.add('rd'); }
    const w = this.words[i]; w.classList.add('cw'); this.idx = i;
    if (S.autoScroll && Date.now() > this.userUntil) {
      const rd = $('#reader'), want = w.offsetTop - rd.clientHeight * 0.35;
      if (Math.abs(rd.scrollTop - want) > S.readSize * 1.3) rd.scrollTo({ top: want, behavior: 'smooth' });
    }
  },
};
requestAnimationFrame(() => Sync.tick());
['touchstart', 'wheel'].forEach(ev => $('#reader').addEventListener(ev, () => { Sync.userUntil = Date.now() + 6000; }, { passive: true }));

function renderPocketInstall(el) {

  $('#sCacheClear').onclick = () => { NATIVE?.cacheClear?.(); toast('Saved audio cleared'); if (NATIVE?.cacheMB) $('#sCache').textContent = '0 MB of prepared speech kept'; };
  $$('#setBody [data-b]').forEach(b => b.onclick = () => { const k = b.dataset.b; S[k] = !S[k]; saveSettings(); b.classList.toggle('on', S[k]); });
  $('#sSpeed').oninput = e => { S.speed = +(+e.target.value).toFixed(2); e.target.nextElementSibling.textContent = S.speed + '×'; saveSettings(); };
  $('#sSpeed').onchange = () => { renderPlayerMeta(); P.restartUnit(); };
  $('#sSize').oninput = e => { S.readSize = +e.target.value; e.target.nextElementSibling.textContent = S.readSize; saveSettings(); document.documentElement.style.setProperty('--read', S.readSize + 'px'); };
  $('#sPre').oninput = e => { S.prefetch = +e.target.value; e.target.nextElementSibling.textContent = S.prefetch; saveSettings(); };
}

/* ---------------- Start ---------------- */
(async function start() {
  document.documentElement.style.setProperty('--read', S.readSize + 'px');
  try { if (navigator.storage?.persist) navigator.storage.persist(); } catch {}
  Pocket.refresh();
  // Older versions could download Kokoro voices; they're no longer used, so free the space
  try { if (NATIVE?.kokoroInstalled && NATIVE.kokoroInstalled()) NATIVE.kokoroUninstall(); } catch {}
  await renderLibrary();
  if (NATIVE && !Pocket.ready && !Phone.is(S.narrator) && !LS.get('packAsked', false)) { LS.set('packAsked', true); voicePackSheet(); }
  const last = LS.get('lastBook', null);
  if (last) {
    const m = await DB.get('meta', last).catch(() => null);
    if (m) {
      const [meta, content] = [m, await DB.get('content', last)];
      if (content) { P.meta = meta; P.content = content; const inc = P.included(); let ch = meta.pos?.ch ?? inc[0]; if (!meta.include[ch]) ch = inc[0]; P.loadChapter(ch, meta.pos?.p || 0); updateMini(); }
    }
  }
})();
</script>
