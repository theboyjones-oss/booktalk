<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>BookTalk</title>
<style>
:root{
  --bg:#000; --s1:#0f0f12; --s2:#18181d; --s3:#23232a; --line:#2b2b33;
  --tx:#f1eee8; --tx2:#a9a6a0; --tx3:#6f6c68;
  --ac:#ff8a5c; --ac2:#ffb38f; --acbg:rgba(255,138,92,.14);
  --ok:#5fd39a; --warn:#ffcc66; --bad:#ff6b6b;
  --r:16px; --serif:Georgia,"Noto Serif","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --read:19px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{resize:vertical;min-height:84px;line-height:1.4}
svg{width:22px;height:22px;fill:currentColor;flex:none}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.view{flex:1;overflow-y:auto;padding:0 16px 150px;display:none}
.view.on{display:block}
header.top{display:flex;align-items:center;gap:10px;padding:18px 2px 12px;position:sticky;top:0;background:linear-gradient(var(--bg) 75%,transparent);z-index:5}
header.top h1{font-size:26px;margin:0;font-weight:750;letter-spacing:-.5px;flex:1}
header.top h1 b{color:var(--ac)}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--s2)}
.iconbtn:active{background:var(--s3)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--tx3);margin:24px 2px 10px;font-weight:650}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--tx2)} .small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--s3);border-radius:999px;padding:11px 18px;font-weight:600}
.btn.pri{background:var(--ac);color:#1b0d05}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn:active{filter:brightness(1.15)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--acbg);border-color:var(--ac);color:var(--ac2)}

/* library */
.empty{text-align:center;padding:60px 20px;color:var(--tx2)}
.empty .big{font-size:54px;margin-bottom:10px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px 14px}
.book{display:flex;flex-direction:column;gap:7px;text-align:left}
.cover{aspect-ratio:2/3;border-radius:10px;overflow:hidden;position:relative;background:var(--s2);box-shadow:0 6px 20px rgba(0,0,0,.6)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.gencover{position:absolute;inset:0;padding:14px 12px;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--serif)}
.gencover .t{font-size:17px;font-weight:700;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.gencover .a{font-size:12px;opacity:.8}
.gencover .f{font-family:var(--sans);font-size:10px;letter-spacing:1.5px;opacity:.6;text-transform:uppercase}
.book .bt{font-weight:650;font-size:14px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.book .ba{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:4px;background:var(--s3);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ac)}
.fab{position:fixed;right:18px;bottom:calc(84px + var(--mini,0px));width:60px;height:60px;border-radius:20px;background:var(--ac);color:#1b0d05;display:grid;place-items:center;box-shadow:0 8px 24px rgba(255,138,92,.35);z-index:20}
.fab svg{width:30px;height:30px}

/* tabs + mini */
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(10,10,12,.96);border-top:1px solid var(--line);z-index:30;padding-bottom:4px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;color:var(--tx3);font-size:11px;font-weight:600}
nav.tabs button.on{color:var(--ac)}
#mini{position:fixed;left:8px;right:8px;bottom:68px;background:var(--s2);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;z-index:29}
#mini .mt{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .ms{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* book page */
.bhead{display:flex;gap:16px;align-items:flex-end;margin-top:6px}
.bhead .cover{width:118px;flex:none}
.bhead h3{font-family:var(--serif);font-size:23px;margin:0 0 4px;line-height:1.15}
.anal{margin-top:16px}
.anal .g{font-weight:650;margin-bottom:4px}
.moods{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.moods::-webkit-scrollbar{display:none}
.chlist .ch{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.chlist .ch:last-child{border:0}
.chlist .ch .n{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chlist .ch.off .n{color:var(--tx3);text-decoration:line-through}
.chlist .ch .why{font-size:11px;color:var(--tx3)}
.tog{width:44px;height:26px;border-radius:13px;background:var(--s3);position:relative;flex:none;transition:.2s}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#888;transition:.2s}
.tog.on{background:var(--ac)} .tog.on::after{left:21px;background:#fff}

/* player */
#player{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s ease}
#player.on{transform:none}
#player .ph{display:flex;align-items:center;gap:8px;padding:12px 10px 8px}
#player .ph .tt{flex:1;min-width:0;text-align:center}
#player .ph .tt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#reader{flex:1;overflow-y:auto;padding:10px 22px 40vh;font-family:var(--serif);font-size:var(--read);line-height:1.62;color:#8d8a85}
#reader p{margin:0 0 .85em;transition:color .25s;border-radius:6px}
#reader p.h{font-weight:700;color:#bdb9b2;font-size:1.15em;margin:1.2em 0 .8em}
#reader p.sc{text-align:center;letter-spacing:.6em;color:var(--tx3)}
#reader p.cur{color:var(--tx)}
#reader p.done{color:#57544f}
#pctl{padding:10px 16px 18px;background:linear-gradient(transparent,var(--bg) 22%);border-top:1px solid var(--line)}
.seek{width:100%;accent-color:var(--ac);padding:0;border:0;background:none;height:24px}
.ctl{display:flex;align-items:center;justify-content:space-between;margin:8px 4px 12px}
.ctl .iconbtn{background:transparent;width:48px;height:48px}
.ctl .iconbtn svg{width:28px;height:28px}
.ctl .play{width:72px;height:72px;border-radius:50%;background:var(--ac);color:#1b0d05;display:grid;place-items:center}
.ctl .play svg{width:38px;height:38px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.timeinfo{display:flex;justify-content:space-between;font-size:12px;color:var(--tx3)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tx3);display:inline-block}
.dot.g{background:var(--ok)} .dot.s{background:var(--warn)} .dot.l{background:var(--ac);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;opacity:0;pointer-events:none;transition:.2s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--s1);border-radius:22px 22px 0 0;border-top:1px solid var(--line);z-index:81;padding:8px 18px 26px;transform:translateY(105%);transition:transform .25s ease}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--s3);margin:4px auto 12px}
#sheet h4{margin:4px 0 14px;font-size:19px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.opt:last-child{border:0}
.opt.on{color:var(--ac2)}
.opt .ic{font-size:22px;width:30px;text-align:center}
label.f{display:block;font-size:12px;color:var(--tx2);margin:14px 2px 6px;font-weight:600}
.slider{display:flex;align-items:center;gap:10px}
.slider input{flex:1;padding:0;border:0;background:none;accent-color:var(--ac)}
.slider output{width:44px;text-align:right;font-variant-numeric:tabular-nums;color:var(--tx2)}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--s3);color:var(--tx)}
.set{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.moodcard{display:flex;gap:12px;align-items:flex-start;padding:14px;margin-bottom:10px}
.moodcard .ic{font-size:28px;line-height:1}
.moodcard .st{font-size:13px;color:var(--tx2);margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

#busy{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px}
.spin{width:42px;height:42px;border:4px solid var(--s3);border-top-color:var(--ac);border-radius:50%;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);background:#2a2a31;color:var(--tx);padding:11px 16px;border-radius:12px;z-index:120;opacity:0;transition:.25s;max-width:88vw;font-size:14px;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
a{color:var(--ac2)}
</style>
</head>
<body>
<div id="app">
  <!-- LIBRARY -->
  <section class="view on" id="v-library">
    <header class="top"><h1>Book<b>Talk</b></h1></header>
    <div id="libList"></div>
  </section>

  <!-- BOOK PAGE -->
  <section class="view" id="v-book">
    <header class="top">
      <button class="iconbtn" data-act="back"><svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z"/></svg></button>
      <button class="iconbtn" data-act="home" title="Home"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
      <div class="grow"></div>
      <button class="iconbtn" id="bkDelete" title="Delete"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg></button>
    </header>
    <div id="bookBody"></div>
  </section>

  <!-- VOICES -->
  <section class="view" id="v-voices">
    <header class="top"><h1>Voices</h1><button class="iconbtn" id="newMood" title="New mood"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></button></header>
    <p class="muted small" style="margin-top:0">Add your own voices, then shape how books are read with moods. Tap a mood to edit it.</p>
    <h2 style="margin-top:6px">Your voices</h2>
    <div id="cloneList"></div>
    <button class="btn block" id="addVoice" style="margin-bottom:6px">🎙️ Add a voice</button>
    <h2>Moods</h2>
    <div id="moodList"></div>
    <button class="btn ghost block" id="resetMoods" style="margin-top:8px">Restore default moods</button>
  </section>

  <!-- SETTINGS -->
  <section class="view" id="v-settings">
    <header class="top"><h1>Settings</h1></header>
    <div id="setBody"></div>
  </section>
</div>

<button class="fab" id="fab" title="Add a book"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></button>
<input type="file" id="fileIn" class="hidden" accept=".epub,.pdf,.txt,.text,.md,.html,.htm,.xhtml,.fb2,.docx,.mobi,.azw,.azw3,.prc,.pdb,.zip,application/epub+zip,application/pdf,text/plain">

<div id="mini" class="hidden">
  <div class="grow" id="miniOpen"><div class="mt" id="miniT"></div><div class="ms" id="miniS"></div></div>
  <button class="iconbtn" id="miniPlay"></button>
</div>

<nav class="tabs">
  <button data-tab="library" class="on"><svg viewBox="0 0 24 24"><path d="M4 6H2v14a2 2 0 0 0 2 2h14v-2H4zm16-4H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2m-1 9h-10V9h10zm-4 4H9v-2h6zm4-8H9V5h10z"/></svg>Library</button>
  <button data-tab="voices"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3m5.3-3A5.3 5.3 0 0 1 12 16.1 5.3 5.3 0 0 1 6.7 11H5a7 7 0 0 0 6 6.7V21h2v-3.3a7 7 0 0 0 6-6.7z"/></svg>Voices</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7"/></svg>Settings</button>
</nav>

<!-- PLAYER -->
<section id="player">
  <div class="ph">
    <button class="iconbtn" id="plClose"><svg viewBox="0 0 24 24"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg></button>
    <div class="tt"><div style="font-weight:650" id="plTitle"></div><div class="small muted" id="plChap"></div></div>
    <button class="iconbtn" id="plHome" title="Home"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
    <button class="iconbtn" id="plChapters"><svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3zm0 4h2v-2H3zm0-8h2V7H3zm4 4h14v-2H7zm0 4h14v-2H7zM7 7v2h14V7z"/></svg></button>
  </div>
  <div id="reader"></div>
  <div id="pctl">
    <input type="range" class="seek" id="seek" min="0" max="100" value="0">
    <div class="timeinfo"><span id="tiLeft"></span><span id="tiRight"></span></div>
    <div class="ctl">
      <button class="iconbtn" id="cPrevCh" title="Previous chapter"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="iconbtn" id="cPrev" title="Back"><svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6zm.5-6 8.5 6V6z"/></svg></button>
      <button class="play" id="cPlay"></button>
      <button class="iconbtn" id="cNext" title="Forward"><svg viewBox="0 0 24 24"><path d="m4 18 8.5-6L4 6zm9-12v12l8.5-6z"/></svg></button>
      <button class="iconbtn" id="cNextCh" title="Next chapter"><svg viewBox="0 0 24 24"><path d="m6 18 8.5-6L6 6zM16 6v12h2V6z"/></svg></button>
    </div>
    <div class="chips">
      <button class="chip" id="chMood"></button>
      <button class="chip" id="chSpeed"></button>
      <button class="chip" id="chSleep"></button>
      <button class="chip" id="chEngine"></button>
    </div>
  </div>
</section>

<div id="scrim"></div>
<div id="sheet"></div>
<div id="busy" class="hidden"><div class="spin"></div><div id="busyT" style="font-weight:650"></div><div id="busyS" class="small muted"></div></div>
<div id="toast"></div>

<script src="jszip.min.js"></script>
<script src="pdf.min.js"></script>
<script>
'use strict';
/* ================================================================
   BookTalk — load an ebook, keep only the story, read it aloud.
   ================================================================ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const NATIVE = window.BookTalkNative || null;
const HEAD = '\u0001', SCENE = '\u0002';

const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>',
};

function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms);
}
function busy(title, sub = '') {
  const b = $('#busy');
  if (title === false) { b.classList.add('hidden'); return; }
  b.classList.remove('hidden'); $('#busyT').textContent = title; $('#busyS').textContent = sub;
}

/* ---------------- Storage ---------------- */
const DB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('booktalk', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('meta', { keyPath: 'id' });
        d.createObjectStore('content', { keyPath: 'id' });
      };
      r.onsuccess = () => res(this.db = r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async run(store, mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode), req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  get(s, id) { return this.run(s, 'readonly', o => o.get(id)); },
  put(s, v) { return this.run(s, 'readwrite', o => o.put(v)); },
  del(s, id) { return this.run(s, 'readwrite', o => o.delete(id)); },
  all(s) { return this.run(s, 'readonly', o => o.getAll()); },
};
const LS = {
  get(k, d) { try { const v = localStorage.getItem('bt.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('bt.' + k, JSON.stringify(v)); } catch {} },
};

/* ---------------- Settings & moods ---------------- */
const DEFAULT_SETTINGS = {
  engine: 'auto',            // auto = Gemini with built-in fallback | gemini | system
  apiKey: '',
  fishKey: '',
  fishModel: 's2.1-pro-free',
  ttsModel: 'gemini-3.1-flash-tts-preview',
  textModel: 'gemini-2.5-flash',
  sysVoice: '',
  speed: 1,
  skipMatter: true,
  readSize: 19,
  autoScroll: true,
  prefetch: 3,
};
let S = Object.assign({}, DEFAULT_SETTINGS, LS.get('settings', {}));
const saveSettings = () => LS.set('settings', S);

const GEMINI_VOICES = [
  ['Sulafat','Warm'],['Charon','Informative'],['Puck','Upbeat'],['Kore','Firm'],['Gacrux','Mature'],['Enceladus','Breathy'],
  ['Vindemiatrix','Gentle'],['Alnilam','Firm'],['Algenib','Gravelly'],['Achernar','Soft'],['Algieba','Smooth'],['Despina','Smooth'],
  ['Aoede','Breezy'],['Zephyr','Bright'],['Autonoe','Bright'],['Fenrir','Excitable'],['Leda','Youthful'],['Orus','Firm'],
  ['Callirrhoe','Easy-going'],['Umbriel','Easy-going'],['Iapetus','Clear'],['Erinome','Clear'],['Rasalgethi','Informative'],
  ['Laomedeia','Upbeat'],['Schedar','Even'],['Pulcherrima','Forward'],['Achird','Friendly'],['Zubenelgenubi','Casual'],
  ['Sadachbia','Lively'],['Sadaltager','Knowledgeable'],
];

/* ---------------- Text helpers ---------------- */
function cleanText(s) {
  return String(s)
    .replace(/[­​‌‍⁠﻿]/g, '')
    .replace(/ /g, ' ')
    .replace(/\[\d{1,3}\]|\{\d{1,3}\}/g, '')
    .replace(/[ \t\f\v\r]+/g, ' ')
    .replace(/ *\n */g, '\n')
    .replace(/\n{2,}/g, '\n')
    .trim();
}
// Returns cleaned paragraph, SCENE for scene breaks, or '' to drop.
function normPara(s) {
  const t = cleanText(s);
  if (!t) return '';
  if (/^[\s*•·~#=_\-–—⁂◆◇●○♦❖✦✧❧☙\.]+$/.test(t)) return /[*•·~#=⁂◆◇●○♦❖✦✧❧☙]/.test(t) || t.replace(/\s/g,'').length >= 3 ? SCENE : '';

  return t;
}

const SKIP_EXACT = /^(cover( page)?|title( page)?|half[- ]?title|copyright( page)?|colophon|imprint|contents|table of contents|toc|index|landmarks|acknowledg(e)?ments?|about the authors?|about the publisher|notes|endnotes|footnotes|bibliography|references|further reading|glossary|permissions|credits|newsletter|sign up|also available|list of illustrations|illustrations|maps?)\s*[.:]?$/i;

function decodeBytes(u8) {
  let s = new TextDecoder('utf-8').decode(u8);
  const bad = (s.match(/�/g) || []).length;
  if (bad > 10 && bad > s.length / 2000) s = new TextDecoder('windows-1252').decode(u8);
  return s;
}
function parseXml(str, type = 'application/xml') {
  const d = new DOMParser().parseFromString(str, type);
  if (d.getElementsByTagName('parsererror').length) return null;

}
function parseMarkup(str) {

  const clean = str.replace(/<!DOCTYPE[^>]*>/i, '');

const lname = el => (el.localName || el.nodeName || '').toLowerCase().replace(/^.*:/, '');
const attr = (el, n) => el.getAttribute ? (el.getAttribute(n) || '') : '';

/* ---------------- Markup → paragraphs (keeps only the reading text) ---------------- */
const DROP_TAGS = new Set(['script','style','head','title','nav','img','svg','image','figure','figcaption','table','audio','video','iframe','object','embed','noscript','math','canvas','map','button','form','input','select','sup','sub','rt','rp','pagebreak']);
const BLOCK_TAGS = new Set(['p','div','section','article','blockquote','li','ul','ol','dl','dt','dd','pre','h1','h2','h3','h4','h5','h6','header','footer','aside','main','body','hr','center','poem','stanza','address','details','summary']);
const JUNK_SEM = /\b(footnotes?|endnotes?|rearnotes?|noteref|pagebreak|doc-pagebreak|doc-noteref|doc-footnote|doc-endnote|doc-backlink|doc-pagelist|page-list|doc-toc|toc|landmarks|doc-index|index)\b/i;
const JUNK_CLASS = /\b(page-?num(ber)?s?|pagenum|page-?break|pagebreak|footnotes?|endnotes?|noteref|fn-?ref|note-?ref|calibre_pb|pg-?num|running-?head)\b/i;

function isJunk(el) {
  const tag = lname(el);
  if (tag === 'sup' || tag === 'sub') {
    // keep real superscript words (e.g. "1st" style), drop footnote markers
    const t = (el.textContent || '').trim();
    return !t || (/^[\d\s,*†‡§¶a-z\[\]()]{1,6}$/i.test(t) && /[\d*†‡§¶]/.test(t)) || !!el.querySelector?.('a');
  }
  if (DROP_TAGS.has(tag)) return true;
  const sem = attr(el, 'epub:type') + ' ' + attr(el, 'role') + ' ' + (el.getAttributeNS ? (el.getAttributeNS('http://www.idpf.org/2007/ops', 'type') || '') : '');
  if (sem.trim() && JUNK_SEM.test(sem)) return true;
  const cls = attr(el, 'class') + ' ' + attr(el, 'id');
  if (cls.trim() && JUNK_CLASS.test(cls)) return true;
  if (attr(el, 'aria-hidden') === 'true' || el.hasAttribute?.('hidden')) return true;
  if (/display\s*:\s*none/i.test(attr(el, 'style'))) return true;

    const href = attr(el, 'href'), t = (el.textContent || '').trim();
    if (href && /#/.test(href) && /^[\[(]?[\d*†‡§¶ivx]{1,4}[\])]?$/i.test(t)) return true; // footnote link
  }

}
function inlineText(node) {
  let s = '';
  for (const c of node.childNodes) {
    if (c.nodeType === 3) s += c.nodeValue;
    else if (c.nodeType === 1) {
      if (isJunk(c)) continue;
      const t = lname(c);
      if (t === 'br') s += '\n';
      else s += inlineText(c);
    }
  }
  return s;
}
function hasBlock(el) {
  for (const c of el.children) {
    const t = lname(c);
    if (BLOCK_TAGS.has(t) || hasBlock(c)) return true;
  }
  return false;
}
// items: [{t, h}] where h = heading level (0 = normal)
function extractItems(root, items = []) {
  let buf = '';
  const flush = () => { if (buf.trim()) items.push({ t: buf, h: 0 }); buf = ''; };
  for (const c of root.childNodes) {
    if (c.nodeType === 3) { buf += c.nodeValue; continue; }
    if (c.nodeType !== 1 || isJunk(c)) continue;
    const tag = lname(c);
    if (tag === 'br') { buf += '\n'; continue; }
    if (tag === 'hr') { flush(); items.push({ t: '* * *', h: 0 }); continue; }
    const hm = /^h([1-6])$/.exec(tag);
    if (hm) { flush(); const t = inlineText(c); if (t.trim()) items.push({ t, h: +hm[1] }); continue; }
    if (BLOCK_TAGS.has(tag) || hasBlock(c)) {
      flush();
      if (hasBlock(c)) extractItems(c, items);
      else { const t = inlineText(c); if (t.trim()) items.push({ t, h: 0 }); }
      continue;
    }
    buf += inlineText(c);
  }
  flush();
  return items;
}
function itemsToParas(items) {
  const out = [];
  for (const it of items) {
    const p = normPara(it.t);
    if (!p) continue;
    if (p === SCENE) { if (out.length && out[out.length - 1] !== SCENE) out.push(SCENE); continue; }
    out.push(it.h ? HEAD + p.replace(/([^.!?:;,])\n/g, '$1. ').replace(/\n/g, ' ') : p);
  }
  while (out[0] === SCENE) out.shift();
  while (out[out.length - 1] === SCENE) out.pop();
  return out;
}
// For single-document formats: split a long item list into chapters at headings.
function splitChapters(items, fallbackTitle = 'Text') {
  const counts = {};
  items.forEach(it => { if (it.h) counts[it.h] = (counts[it.h] || 0) + 1; });
  let level = 0;
  for (let l = 1; l <= 6; l++) if ((counts[l] || 0) >= 2) { level = l; break; }
  const isBreak = it => level ? (it.h && it.h <= level) : (CHAPTER_RE.test(cleanText(it.t)) && cleanText(it.t).length < 80);
  const chapters = []; let cur = { title: '', items: [] };
  for (let it of items) {
    if (isBreak(it) && cur.items.some(x => !x.h)) { chapters.push(cur); cur = { title: '', items: [] }; }
    if (isBreak(it) && !cur.title) cur.title = cleanText(it.t).replace(/\n/g, ' ');
    if (!level && isBreak(it)) it = { t: it.t, h: 2 };
    cur.items.push(it);
  }
  chapters.push(cur);
  let out = chapters.map((c, i) => ({ title: c.title || (i === 0 ? 'Opening' : 'Section ' + (i + 1)), paras: itemsToParas(c.items) }))
                    .filter(c => c.paras.length);
  // One giant chapter? Cut into ~4000-word parts so you can navigate.
  if (out.length === 1 && out[0].paras.length > 300) {
    const all = out[0].paras, parts = []; let cur2 = [], words = 0;
    for (const p of all) { cur2.push(p); words += p.split(/\s+/).length; if (words > 4000 && p !== SCENE) { parts.push(cur2); cur2 = []; words = 0; } }
    if (cur2.length) parts.push(cur2);
    out = parts.map((p, i) => ({ title: (fallbackTitle || 'Part') + ' · Part ' + (i + 1), paras: p }));
  }
  return out;
}

/* ---------------- Front / back matter detection ---------------- */
function classify(ch, typeHint) {
  const title = (ch.title || '').trim();
  if (typeHint) return 'Marked as ' + typeHint.replace(/-/g, ' ');
  if (SKIP_EXACT.test(title)) return 'Looks like ' + title.toLowerCase();
  if (SKIP_PREFIX.test(title)) return 'Not part of the story';
  const body = ch.paras.filter(p => p !== SCENE).map(p => p.replace(HEAD, ''));
  const text = body.join(' ');
  const words = text.split(/\s+/).filter(Boolean).length;
  if (words < 450 && /(all rights reserved|isbn[\s:-]*[\dx-]{10}|first published|copyright\s*(©|\(c\))|©\s*\d{4}|printed (and bound )?in|british library cataloguing|library of congress)/i.test(text)) return 'Copyright page';
  if (body.length >= 6) {
    const short = body.filter(p => p.length < 70).length / body.length;
    if (short > 0.85 && /\b(contents|chapter\s+(1|one|i)\b)/i.test(text.slice(0, 600)) && words < 1500) return 'Table of contents';
  }
  if (words < 12 && body.length <= 2 && !CHAPTER_RE.test(body[0] || '')) return 'Too short (title or blank page)';
  return '';
}

/* ---------------- Parsers ---------------- */
function resolvePath(base, href) {
  const parts = (base + href).split('/'), out = [];
  for (const p of parts) { if (p === '..') out.pop(); else if (p !== '.' && p !== '') out.push(p); }
  return out.join('/');
}
async function makeThumb(blob) {
  try {
    const bmp = await createImageBitmap(blob);
    const w = 300, h = Math.round(bmp.height * (w / bmp.width));
    const c = document.createElement('canvas'); c.width = w; c.height = Math.min(h, 480);
    c.getContext('2d').drawImage(bmp, 0, 0, w, h);
    return c.toDataURL('image/jpeg', 0.78);
  } catch { return ''; }
}

async function parseEpub(buf, onStage) {
  const zip = await JSZip.loadAsync(buf);
  const file = p => zip.file(p) || zip.file(decodeURIComponent(p)) || zip.file(new RegExp('^' + p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$', 'i'))[0];
  const readStr = async p => { const f = file(p); return f ? f.async('string') : null; };
  if (zip.file('META-INF/rights.xml')) throw new Error('This EPUB is DRM-protected, so its text can\'t be read. Use a DRM-free copy.');
  const enc = await readStr('META-INF/encryption.xml');
  if (enc) {
    const algs = [...enc.matchAll(/Algorithm="([^"]+)"/g)].map(m => m[1]);
    const fontOnly = a => /idpf\.org\/2008\/embedding|ns\.adobe\.com\/pdf\/enc#RC/.test(a);
    const encFiles = [...enc.matchAll(/URI="([^"]+)"/g)].map(m => m[1]);
    if (algs.some(a => !fontOnly(a)) && encFiles.some(f => /x?html?$/i.test(f))) throw new Error('This EPUB is DRM-protected, so its text can\'t be read. Use a DRM-free copy.');
  }
  const cont = parseXml(await readStr('META-INF/container.xml') || '');
  const opfPath = cont?.getElementsByTagNameNS('*', 'rootfile')[0]?.getAttribute('full-path');
  if (!opfPath) throw new Error('Not a valid EPUB (no package file).');
  const base = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';
  const opf = parseXml(await readStr(opfPath));
  if (!opf) throw new Error('EPUB package file is damaged.');
  const md = tag => opf.getElementsByTagNameNS('*', tag)[0]?.textContent?.trim() || '';
  const title = md('title'), author = md('creator'), subject = [...opf.getElementsByTagNameNS('*', 'subject')].map(e => e.textContent.trim()).join(', ');
  const description = md('description').replace(/<[^>]+>/g, ' ').slice(0, 600);

  const manifest = {};
  for (const it of opf.getElementsByTagNameNS('*', 'item')) {
    manifest[it.getAttribute('id')] = { href: resolvePath(base, decodeURIComponent(it.getAttribute('href') || '')), type: it.getAttribute('media-type') || '', props: it.getAttribute('properties') || '' };
  }
  // Table of contents labels + landmark types
  const labels = {}, types = {};
  const addType = (href, t) => { const k = href.split('#')[0]; if (!types[k]) types[k] = t; };
  const navItem = Object.values(manifest).find(m => /\bnav\b/.test(m.props));
  if (navItem) {
    const navDoc = parseMarkup(await readStr(navItem.href) || '<html/>');
    const nbase = navItem.href.includes('/') ? navItem.href.slice(0, navItem.href.lastIndexOf('/') + 1) : '';
    for (const nav of navDoc.getElementsByTagName('nav')) {
      const kind = (attr(nav, 'epub:type') || nav.getAttributeNS?.('http://www.idpf.org/2007/ops', 'type') || '').toLowerCase();
      for (const a of nav.getElementsByTagName('a')) {
        const href = resolvePath(nbase, decodeURIComponent(a.getAttribute('href') || '')), k = href.split('#')[0];
        if (kind.includes('landmarks')) addType(href, (attr(a, 'epub:type') || a.getAttributeNS?.('http://www.idpf.org/2007/ops', 'type') || '').toLowerCase());
        else if (kind.includes('toc') && !labels[k]) labels[k] = cleanText(a.textContent).replace(/\n/g, ' ');
      }
    }
  }
  const ncxId = opf.getElementsByTagNameNS('*', 'spine')[0]?.getAttribute('toc');
  if (ncxId && manifest[ncxId] && !Object.keys(labels).length) {
    const ncx = parseXml(await readStr(manifest[ncxId].href) || '');
    const nb = manifest[ncxId].href.includes('/') ? manifest[ncxId].href.slice(0, manifest[ncxId].href.lastIndexOf('/') + 1) : '';
    if (ncx) for (const np of ncx.getElementsByTagNameNS('*', 'navPoint')) {
      const src = np.getElementsByTagNameNS('*', 'content')[0]?.getAttribute('src'); const lab = np.getElementsByTagNameNS('*', 'text')[0]?.textContent;
      if (src) { const k = resolvePath(nb, decodeURIComponent(src)).split('#')[0]; if (!labels[k]) labels[k] = cleanText(lab || ''); }
    }
  }
  for (const r of opf.getElementsByTagNameNS('*', 'reference')) addType(resolvePath(base, decodeURIComponent(r.getAttribute('href') || '')), (r.getAttribute('type') || '').toLowerCase());

  // Cover
  let cover = '';
  let coverItem = Object.values(manifest).find(m => /cover-image/.test(m.props));
  if (!coverItem) { const cm = [...opf.getElementsByTagNameNS('*', 'meta')].find(m => m.getAttribute('name') === 'cover'); if (cm) coverItem = manifest[cm.getAttribute('content')]; }
  if (coverItem && /^image\//.test(coverItem.type)) { const f = file(coverItem.href); if (f) cover = await makeThumb(await f.async('blob')); }

  const SKIP_TYPE = /^(cover|toc|copyright|copyright-page|colophon|index|loi|lot|titlepage|title-page|halftitlepage|bibliography|acknowledgements|acknowledgments|imprint|other-credits|contributors|endnotes|rearnotes|footnotes|glossary|landmarks|page-list|errata|preview)$/;
  const chapters = [];
  const spine = [...opf.getElementsByTagNameNS('*', 'itemref')];
  for (let i = 0; i < spine.length; i++) {
    const ref = spine[i], m = manifest[ref.getAttribute('idref')];
    if (!m || !/html|xml/.test(m.type) || /\bnav\b/.test(m.props)) continue;
    onStage?.(`Reading section ${i + 1} of ${spine.length}`);
    const src = await readStr(m.href); if (!src) continue;
    const doc = parseMarkup(src);
    const body = doc.body || doc.getElementsByTagName('body')[0] || doc.documentElement;
    const items = extractItems(body);
    const paras = itemsToParas(items);
    if (!paras.length) continue;
    const firstHead = paras.find(p => p[0] === HEAD);
    let ttl = labels[m.href] || (firstHead ? firstHead.slice(1) : '') || '';
    if (!ttl) { const f = paras.find(p => p !== SCENE); ttl = f.replace(HEAD, '').slice(0, 50) + (f.length > 50 ? '…' : ''); }
    const t = types[m.href];

    chapters.push({ title: ttl, paras, typeHint });
    if (i % 4 === 0) await sleep(0);
  }
  return { title, author, subject, description, cover, chapters };
}

async function parsePdf(buf, onStage) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
  let title = '', author = '';
  try { const m = await pdf.getMetadata(); title = m.info?.Title || ''; author = m.info?.Author || ''; } catch {}
  const pages = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    if (n % 5 === 1) onStage?.(`Reading page ${n} of ${pdf.numPages}`);
    const page = await pdf.getPage(n);
    const tc = await page.getTextContent();
    const items = tc.items.filter(it => it.str !== undefined).map(it => ({ s: it.str, x: it.transform[4], y: it.transform[5], h: Math.abs(it.transform[3]) || Math.hypot(it.transform[2], it.transform[3]) || 10, w: it.width || 0 }));
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    const lines = [];
    for (const it of items) {
      if (!it.s.trim() && !lines.length) continue;
      const L = lines[lines.length - 1];
      if (L && Math.abs(L.y - it.y) < Math.max(L.h, it.h) * 0.5) {
        const gap = it.x - L.xe;
        L.t += (gap > it.h * 0.15 && !/\s$/.test(L.t) && !/^\s/.test(it.s) ? ' ' : '') + it.s;
        L.xe = Math.max(L.xe, it.x + it.w); L.h = Math.max(L.h, it.h);
      } else lines.push({ t: it.s, x: it.x, xe: it.x + it.w, y: it.y, h: it.h, page: n });
    }
    pages.push(lines.filter(l => l.t.trim()).map(l => (l.t = l.t.replace(/\s+/g, ' ').trim(), l)));
    page.cleanup?.();
  }
  const totalChars = pages.reduce((a, p) => a + p.reduce((b, l) => b + l.t.length, 0), 0);
  if (totalChars < 200) throw new Error('This PDF looks like scanned images, so there is no text to read. A text-based PDF or EPUB will work.');

  // Running headers / footers: lines that repeat on many pages (digits ignored)
  const key = t => t.toLowerCase().replace(/\d+/g, '#').replace(/\s+/g, ' ').trim();
  const freq = {};
  for (const p of pages) { const edge = new Set([...p.slice(0, 2), ...p.slice(-2)].map(l => key(l.t))); edge.forEach(k => freq[k] = (freq[k] || 0) + 1); }
  const minRep = Math.max(3, pages.length * 0.25);
  const hs = pages.flat().map(l => l.h).sort((a, b) => a - b), bodyH = hs[Math.floor(hs.length / 2)] || 10;
  const isPageNum = t => /^(page\s*)?[\divxlcdm]{1,6}(\s*(of|\/)\s*\d+)?$/i.test(t.trim()) || /^[-–—\s]*\d{1,4}[-–—\s]*$/.test(t);

    const drop = new Set();
    [0, 1, p.length - 2, p.length - 1].forEach(i => { const l = p[i]; if (!l) return; if (isPageNum(l.t) || (freq[key(l.t)] >= minRep && l.t.length < 120 && l.h <= bodyH * 1.15 && !CHAPTER_RE.test(l.t))) drop.add(l); });
    for (let i = p.length - 1; i >= 0; i--) if (drop.has(p[i])) p.splice(i, 1);
  }
  // Typical metrics
  const all = pages.flat();
  const med = arr => { const a = arr.filter(Number.isFinite).sort((x, y) => x - y); return a.length ? a[Math.floor(a.length / 2)] : 0; };
  const mh = med(all.map(l => l.h)) || 10;
  const gaps = []; pages.forEach(p => { for (let i = 1; i < p.length; i++) { const g = p[i - 1].y - p[i].y; if (g > 0 && g < mh * 4) gaps.push(g); } });
  const mg = med(gaps) || mh * 1.3;

  // Outline → chapter start pages

    const outline = await pdf.getOutline();
    if (outline && outline.length >= 2) {

        let dest = o.dest; if (typeof dest === 'string') dest = await pdf.getDestination(dest);
        if (Array.isArray(dest) && dest[0]) { const pi = await pdf.getPageIndex(dest[0]); starts.push({ page: pi + 1, title: cleanText(o.title) }); }
      }
      starts = starts.filter((s, i, a) => a.findIndex(x => x.page === s.page) === i).sort((a, b) => a.page - b.page);
    }

  const items = [];

  const push = () => { if (para) items.push(para); para = null; };

    else if (zip.file('word/document.xml')) book = await parseDocx(zip);

      const ep = Object.values(zip.files).find(f => /\.epub$/i.test(f.name));

  if (/^(untitled|unknown|anonymous|document\d*|microsoft word.*|.*\.(docx?|pdf|indd))$/i.test((book.title || '').trim())) book.title = '';
  if (/^(unknown|anonymous|administrator|user|owner)$/i.test((book.author || '').trim())) book.author = '';
  book.title = cleanText(book.title || '').replace(/\n/g, ' ') || file.name.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ');

  book.chapters = (book.chapters || []).filter(c => c.paras && c.paras.length);
  if (!book.chapters.length) throw new Error('No readable text found in this book.');

const Out = {
  webCtx: null, webSrc: null, voices: [],
  sayIds: new Set(),
  say(id, text, pitch, rate, voice, pauseMs = 0) {

    const u = new SpeechSynthesisUtterance(text);
    u.pitch = pitch; u.rate = rate; u.lang = 'en-GB';
    const v = speechSynthesis.getVoices().find(v => v.name === voice); if (v) u.voice = v;
    u.onend = () => setTimeout(() => onNative({ type: 'done', id }), pauseMs);
    u.onerror = e => { if (e.error !== 'interrupted' && e.error !== 'canceled') onNative({ type: 'error', id, msg: e.error }); };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  },
  silence(id, ms) {
    if (NATIVE) { NATIVE.silence(id, ms); return; }

  },
  pcm(id, b64, rate, speed, pauseMs = 0) {
    if (NATIVE) { NATIVE.pcmPlay(id, b64, rate, speed, pauseMs); return; }

    const bin = atob(b64), n = bin.length >> 1, f = new Float32Array(n);

    const ab = ctx.createBuffer(1, n, rate); ab.copyToChannel(f, 0);
    const src = ctx.createBufferSource(); src.buffer = ab; src.playbackRate.value = speed; src.connect(ctx.destination);
    src.onended = () => { if (this.webSrc === src) { this.webSrc = null; setTimeout(() => onNative({ type: 'done', id }), pauseMs); } };
    this.webSrc = src; src.start();
  },
  play(id, a, speed, pauseMs = 0) {

  },
  drop(key) { if (NATIVE && key) NATIVE.dropStored(key); },
  stopWeb() { clearTimeout(this.silT); if (this.webSrc) { const s = this.webSrc; this.webSrc = null; try { s.stop(); } catch {} } },
  stop() {

/* ---------------- Player ---------------- */
const MAX_UNIT = 650;
function splitSentences(t, max) {
  const sents = t.match(/[^.!?…]+(?:[.!?…]+["'”’)\]]*\s*|$)/g) || [t];
  const out = []; let cur = '';
  for (const s of sents) {
    if (cur && (cur + s).length > max) { out.push(cur.trim()); cur = ''; }
    if (s.length > max) { for (let i = 0; i < s.length; i += max) out.push(s.slice(i, i + max)); continue; }
    cur += s;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}
function buildUnits(paras) {
  const units = []; let cur = null;
  const flush = () => { if (cur) units.push(cur); cur = null; };
  paras.forEach((raw, i) => {
    if (raw === SCENE) { flush(); units.push({ p0: i, p1: i, scene: true, text: '' }); return; }
    if (raw[0] === HEAD) { flush(); const t = raw.slice(1); units.push({ p0: i, p1: i, head: true, text: /[.!?:]$/.test(t) ? t : t + '.' }); return; }
    if (raw.length > MAX_UNIT) { flush(); splitSentences(raw, MAX_UNIT).forEach(s => units.push({ p0: i, p1: i, text: s })); return; }
    if (cur && cur.text.length + raw.length + 1 <= MAX_UNIT) { cur.text += '\n' + raw; cur.p1 = i; }
    else { flush(); cur = { p0: i, p1: i, text: raw }; }
  });
  flush();
  return units;
}

const P = {
  meta: null, content: null, ch: 0, units: [], u: 0, playing: false, curId: null, token: 0,
  cache: new Map(), unitsCache: new Map(), gemOffUntil: 0, fishOffUntil: 0, lastEngine: '', loading: false,
  sleepAt: 0, sleepChapter: false, active: 0,

  get mood() { return moodById(this.meta?.moodId || 'story'); },
  included() { return this.meta.include.map((v, i) => v ? i : -1).filter(i => i >= 0); },
  unitsFor(ch) { if (!this.unitsCache.has(ch)) this.unitsCache.set(ch, buildUnits(this.content.chapters[ch].paras)); return this.unitsCache.get(ch); },

  async open(id, autoplay) {

    this.pause();

    if (!meta || !content) { toast('Book not found'); return; }

    this.loadChapter(ch, meta.pos?.p || 0);
    LS.set('lastBook', id);
    showPlayer(true);
    if (autoplay) this.play();
    updateMini();
  },
  loadChapter(ch, para = 0) {

    renderReader(); this.highlight(true); this.trimCache();
  },
  play() {
    if (!this.meta) return;

    this.step();
  },
  pause() {
    if (!this.playing) return;

    renderPlayState(); setEngineChip('');
    if (this.meta) Out.session(true, false, this.meta.title, this.chapterTitle());
  },
  toggle() { this.playing ? this.pause() : this.play(); },
  close() { this.pause(); Out.session(false, false); },
  chapterTitle() { return this.content?.chapters[this.ch]?.title || ''; },

  narrator() { const id = this.meta?.narrator; return id ? CLONES.find(c => c.id === id) || null : null; },
  // Which engine to try first right now: 'fish' (your own voice), 'gemini' or 'system'
  engine() {
    if (S.engine === 'system' || !navigator.onLine) return 'system';
    const now = Date.now();
    if (this.narrator() && S.fishKey && now >= this.fishOffUntil) return 'fish';
    if (S.apiKey && now >= this.gemOffUntil) return 'gemini';
    return 'system';
  },
  key(ch, u, eng) {
    const m = this.mood;
    return eng === 'fish' ? `${ch}:${u}:fish|${this.meta.narrator}|${m.fishTag || ''}|${S.fishModel}`
      : `${ch}:${u}:gem|${m.voice}|${m.style}|${this.meta.note || ''}|${S.ttsModel}`;
  },
  audioFor(ch, u, eng) {
    const unit = this.unitsFor(ch)[u];
    const k = this.key(ch, u, eng);
    if (this.cache.has(k)) return this.cache.get(k);

  prefetch() {

  async step() {

  engineFailed(eng, e) {

    else if (st === 400 || st === 401 || st === 403 || st === 404) { wait = 15 * 60000; msg = `${name} rejected the request: ${(e.message || st).toString().slice(0, 120)}`; }

  onDone(id) {

  },
  onError(id, msg) {

  prevChapter() {

  jumpPara(p) { const u = this.units.findIndex(x => x.p1 >= p); this.jump(u < 0 ? 0 : u); },

function bookProgress(meta, content, ch, p) {
  let done = 0, total = 0;
  meta.include.forEach((on, i) => {
    if (!on) return; const len = meta.chLens[i] || 0; total += len;
    if (i < ch) done += len;
    else if (i === ch) { const paras = content.chapters[i].paras; let c = 0; for (let k = 0; k < p && k < paras.length; k++) c += paras[k].length; done += c; }
  });
  return total ? clamp(done / total, 0, 1) : 0;
}

/* Events from Android (TTS/audio callbacks, notification & headset buttons) */
function onNative(ev) {
  if (typeof ev === 'string') { try { ev = JSON.parse(ev); } catch { return; } }
  switch (ev.type) {
    case 'done': if (ev.id === Preview.id) Preview.done(); else P.onDone(ev.id); break;
    case 'error': if (ev.id === Preview.id) { Preview.done(); toast('Voice error: ' + (ev.msg || '')); } else P.onError(ev.id, ev.msg); break;
    case 'fish': Fish.onEvent(ev); break;
    case 'voices': Out.loadVoices(); if ($('#v-settings').classList.contains('on')) renderSettings(); break;
    case 'media':
      if (ev.action === 'toggle') P.toggle();
      else if (ev.action === 'play') P.play();
      else if (ev.action === 'pause') P.pause();
      else if (ev.action === 'next') P.jump(P.u + 1);
      else if (ev.action === 'prev') P.jump(P.u - 1);
      else if (ev.action === 'stop') { P.close(); }
      break;
  }
}

/* ---------------- UI: import ---------------- */
$('#fab').onclick = () => $('#fileIn').click();
$('#fileIn').onchange = async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  busy('Opening ' + file.name, 'Pulling out the story text…');
  try {
    const book = await parseBook(file, s => $('#busyS').textContent = s);
    busy('Analysing the book', 'Finding the right voice…');
    book.chapters.forEach(c => { const why = classify(c, c.typeHint); c.skip = S.skipMatter && !!why; c.why = why; });
    if (S.skipMatter && book.chapters.every(c => c.skip)) book.chapters.forEach(c => c.skip = false);
    let analysis = analyseLocal(book);
    if (S.apiKey && S.engine !== 'system' && navigator.onLine) {
      try { analysis = await Promise.race([analyseGemini(book), sleep(25000).then(() => { throw new Error('timeout'); })]); } catch (err) { console.warn(err); }
    }
    const id = uid();
    const meta = {
      id, title: book.title, author: book.author, format: book.format, cover: book.cover || '', added: Date.now(), lastRead: 0,
      chapters: book.chapters.map(c => ({ title: c.title, why: c.why || '' })),
      include: book.chapters.map(c => !c.skip),
      chLens: book.chapters.map(c => c.paras.reduce((a, p) => a + p.length, 0)),
      words: book.chapters.reduce((a, c) => a + c.paras.reduce((b, p) => b + p.split(/\s+/).length, 0), 0),
      moodId: analysis.mood, analysis, note: analysis.note || '', pos: null, progress: 0,
      subject: book.subject || '', description: book.description || '',
    };
    const first = meta.include.indexOf(true); meta.pos = { ch: first < 0 ? 0 : first, p: 0 };
    await DB.put('content', { id, chapters: book.chapters.map(c => ({ title: c.title, paras: c.paras })) });
    await DB.put('meta', meta);
    busy(false);
    openBook(id);
  } catch (err) {
    busy(false); console.error(err);
    openSheet(`<h4>Couldn't open that book</h4><p class="muted">${esc(err.message || err)}</p><button class="btn block" onclick="closeSheet()">OK</button>`);

function addVoiceSheet() {
  let wav = null, rec = null, chunks = [], timer = null, t0 = 0, url = '';
  openSheet(`<h4>Add a voice</h4>
    ${S.fishKey ? '' : `<label class="f" style="margin-top:0">Fish Audio API key</label><input id="avKey" type="password" placeholder="Paste your Fish Audio API key"><p class="small muted">Free account and key at <a href="https://fish.audio/app/api-keys/" target="_blank">fish.audio/app/api-keys</a>.</p>`}
    <label class="f">Name</label><input id="avName" placeholder="e.g. Me, Mum, Grandad" maxlength="40">
    <label class="f">Sample (20–30 seconds of clear talking, little background noise)</label>
    <div class="row"><button class="btn pri grow" id="avRec">● Record</button><button class="btn grow" id="avFile">Choose file</button></div>
    <input type="file" id="avIn" class="hidden" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac,.flac,.opus,.webm,.mp4">
    <div class="card small" id="avRead" style="margin-top:10px;font-family:var(--serif);font-size:15px;line-height:1.5"><div class="muted small" style="font-family:var(--sans);margin-bottom:6px">If you're recording, read this aloud naturally:</div>${READ_ALOUD}</div>
    <div id="avStatus" class="small muted" style="margin-top:10px"></div>
    <audio id="avAudio" controls class="hidden" style="width:100%;margin-top:8px"></audio>
    <label class="row small" style="margin-top:14px;gap:10px;align-items:flex-start"><input type="checkbox" id="avOk" style="width:auto;margin-top:2px"><span>This is my voice, or the person has agreed to me using their voice.</span></label>
    <button class="btn pri block" id="avCreate" style="margin-top:14px" disabled>Create voice</button>`, sh => {
    const st = $('#avStatus', sh), au = $('#avAudio', sh), ok = $('#avOk', sh), cr = $('#avCreate', sh);
    const ready = () => cr.disabled = !(wav && ok.checked && $('#avName', sh).value.trim());
    ok.onchange = ready; $('#avName', sh).oninput = ready;
    const take = async blob => {
      st.textContent = 'Processing…';
      try {
        const r = await toWav(blob);
        if (r.seconds < 8) { st.textContent = `Only ${Math.round(r.seconds)} seconds. Aim for 20–30 seconds.`; wav = null; ready(); return; }
        wav = r.wav; if (url) URL.revokeObjectURL(url); url = URL.createObjectURL(wav);
        au.src = url; au.classList.remove('hidden');
        st.textContent = `✓ ${Math.round(r.seconds)} second sample ready${r.seconds >= 59 ? ' (trimmed to 60 s)' : ''}. Have a listen.`;
      } catch (e) { st.textContent = 'Couldn\'t read that audio: ' + (e.message || e); wav = null; }
      ready();
    };
    $('#avFile', sh).onclick = () => $('#avIn', sh).click();
    $('#avIn', sh).onchange = e => { const f = e.target.files[0]; if (f) take(f); e.target.value = ''; };
    $('#avRec', sh).onclick = async () => {
      const b = $('#avRec', sh);
      if (rec && rec.state === 'recording') { rec.stop(); return; }
      try {
        Out.stop(); if (P.playing) P.pause();
        const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: true } });
        chunks = []; rec = new MediaRecorder(stream);
        rec.ondataavailable = e => e.data.size && chunks.push(e.data);
        rec.onstop = () => { clearInterval(timer); stream.getTracks().forEach(t => t.stop()); b.textContent = '● Record again'; take(new Blob(chunks, { type: rec.mimeType || 'audio/webm' })); };
        rec.start(); t0 = Date.now(); b.textContent = '■ Stop';
        timer = setInterval(() => { const sec = Math.round((Date.now() - t0) / 1000); st.textContent = `Recording… ${sec}s ${sec < 20 ? '(keep going)' : '(sounds good, tap Stop when ready)'}`; if (sec >= 45) rec.stop(); }, 500);
      } catch (e) { st.textContent = 'Microphone not available: ' + (e.message || e) + '. You can choose an audio file instead.'; }
    };
    cr.onclick = async () => {
      const k = $('#avKey', sh); if (k) { if (!k.value.trim()) { toast('Paste your Fish Audio key first'); return; } S.fishKey = k.value.trim(); saveSettings(); }
      const name = $('#avName', sh).value.trim();
      cr.disabled = true; cr.textContent = 'Creating voice…';
      try {
        const id = await Fish.create(name, wav);
        if (!id) throw new Error('No voice id returned');
        CLONES.push({ id, name, added: Date.now() }); saveClones();
        closeSheet(); renderClones(); toast(`“${name}” is ready. Pick it as the narrator on any book.`, 4000);
      } catch (e) { cr.disabled = false; cr.textContent = 'Create voice'; st.textContent = 'Fish Audio said: ' + (e.message || e); }
    };
  });
}
$('#addVoice').onclick = addVoiceSheet;

function renderMoods() {
  renderClones();
  $('#moodList').innerHTML = MOODS.map(m => `
    <div class="card moodcard" data-id="${m.id}"><div class="ic">${m.icon}</div><div class="grow">
      <div class="row"><b class="grow">${esc(m.name)}</b><span class="small muted">${esc(m.voice)}</span></div>
      <div class="st">${esc(m.style)}</div></div></div>`).join('');
  $$('.moodcard').forEach(c => c.onclick = () => editMood(c.dataset.id));
}
$('#newMood').onclick = () => {
  const m = { id: 'm' + uid(), name: 'My mood', icon: '🎭', voice: 'Sulafat', style: 'in a ', pitch: 1, pace: 1, sysVoice: '' };
  MOODS.push(m); saveMoods(); renderMoods(); editMood(m.id, true);
};
$('#resetMoods').onclick = () => openSheet(`<h4>Restore default moods?</h4><p class="muted">Your edits to the built-in moods will be undone. Moods you created stay.</p><div class="row"><button class="btn grow" onclick="closeSheet()">Cancel</button><button class="btn pri grow" id="rsYes">Restore</button></div>`, sh => {
  $('#rsYes', sh).onclick = () => { const custom = MOODS.filter(m => !DEFAULT_MOODS.some(d => d.id === m.id)); MOODS = JSON.parse(JSON.stringify(DEFAULT_MOODS)).concat(custom); saveMoods(); renderMoods(); closeSheet(); };
});
function editMood(id, isNew) {
  const m = moodById(id); const draft = { ...m };
  const voices = Out.loadVoices();
  const sl = (k, label, min, max, step) => `<label class="f">${label}</label><div class="slider"><input type="range" min="${min}" max="${max}" step="${step}" value="${draft[k]}" data-k="${k}"><output>${draft[k]}</output></div>`;
  openSheet(`<h4>${isNew ? 'New mood' : 'Edit mood'}</h4>
    <div class="row"><input id="mdIcon" value="${esc(draft.icon)}" style="width:62px;text-align:center;font-size:22px" maxlength="4"><input id="mdName" value="${esc(draft.name)}" placeholder="Name"></div>
    <label class="f">Gemini voice</label>
    <select id="mdVoice">${GEMINI_VOICES.map(([n, d]) => `<option value="${n}" ${n === draft.voice ? 'selected' : ''}>${n} · ${d}</option>`).join('')}</select>
    <label class="f">Delivery (how the Gemini voice should read)</label>
    <textarea id="mdStyle" rows="3" placeholder="in a dry, deadpan tone, like a weary butler…">${esc(draft.style)}</textarea>
    <div class="moods" style="margin-top:8px">${['dry and deadpan', 'whispery and intimate', 'cheerful and bouncy', 'grave and slow', 'breathless with excitement', 'with a broad Yorkshire accent', 'like an old radio drama'].map(s => `<button class="chip" data-add="${s}">+ ${s}</button>`).join('')}</div>
    <label class="f">Emotion tag for your own voices (Fish Audio)</label>
    <input id="mdFish" value="${esc(draft.fishTag || '')}" placeholder="e.g. [sad], [whispering], [excited]; leave blank for none">
    ${sl('pace', 'Pace (all voices)', 0.6, 1.6, 0.02)}
    ${sl('pitch', 'Pitch (built-in voice)', 0.6, 1.5, 0.02)}
    <label class="f">Built-in voice for this mood</label>
    <select id="mdSys"><option value="">Use default from Settings</option>${voices.map(v => `<option value="${esc(v.name)}" ${v.name === draft.sysVoice ? 'selected' : ''}>${esc(v.name)} · ${esc(v.lang)}${v.network ? ' · online' : ''}</option>`).join('')}</select>
    <label class="f">Preview text</label>
    <textarea id="mdSample" rows="2">${esc(draft.sample || SAMPLE)}</textarea>
    <div class="row" style="margin-top:12px"><button class="btn grow" id="pvG">✨ Gemini preview</button><button class="btn grow" id="pvS">Built-in preview</button></div>
    ${CLONES.length ? `<div class="row" style="margin-top:8px">${CLONES.slice(0, 3).map(c => `<button class="btn grow" data-pvc="${c.id}">🗣️ ${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="row" style="margin-top:12px">${DEFAULT_MOODS.some(d => d.id === id) ? '' : '<button class="btn ghost" id="mdDel" style="color:var(--bad)">Delete</button>'}<button class="btn ghost grow" id="mdDup">Duplicate</button><button class="btn pri grow" id="mdSave">Save</button></div>`, sh => {
    const read = () => {
      draft.icon = $('#mdIcon', sh).value.trim() || '🎭'; draft.name = $('#mdName', sh).value.trim() || 'Mood';
      draft.voice = $('#mdVoice', sh).value; draft.style = $('#mdStyle', sh).value.trim(); draft.sysVoice = $('#mdSys', sh).value; draft.fishTag = $('#mdFish', sh).value.trim();
      const smp = $('#mdSample', sh).value.trim(); draft.sample = smp && smp !== SAMPLE ? smp : undefined;
    };
    $$('input[type=range]', sh).forEach(r => r.oninput = () => { draft[r.dataset.k] = +r.value; r.nextElementSibling.textContent = (+r.value).toFixed(2); });
    $$('[data-add]', sh).forEach(b => b.onclick = () => { const ta = $('#mdStyle', sh); ta.value = (ta.value.trim().replace(/[.,]$/, '') + (ta.value.trim() ? ', ' : 'in a ') + b.dataset.add).trim(); });
    $('#pvG', sh).onclick = e => { read(); Preview.run(draft, 'gemini', e.currentTarget); };
    $('#pvS', sh).onclick = e => { read(); Preview.run(draft, 'system', e.currentTarget); };
    $$('[data-pvc]', sh).forEach(b => b.onclick = e => { read(); Preview.run({ ...draft, clone: b.dataset.pvc }, 'fish', e.currentTarget); });
    $('#mdSave', sh).onclick = () => {
      read(); Object.assign(m, draft); saveMoods(); closeSheet(); renderMoods();
      if (P.meta && P.meta.moodId === m.id) { P.clearCache(); renderPlayerMeta(); }
    };
    $('#mdDup', sh).onclick = () => { read(); const c = { ...draft, id: 'm' + uid(), name: draft.name + ' copy' }; MOODS.push(c); saveMoods(); closeSheet(); renderMoods(); editMood(c.id, true); };
    $('#mdDel', sh)?.addEventListener('click', () => { MOODS = MOODS.filter(x => x.id !== id); saveMoods(); closeSheet(); renderMoods(); });
  });
}

/* ---------------- UI: settings ---------------- */
const TTS_MODELS = [['gemini-3.1-flash-tts-preview', 'Gemini 3.1 Flash TTS (newest)'], ['gemini-2.5-flash-preview-tts', 'Gemini 2.5 Flash TTS'], ['gemini-2.5-pro-preview-tts', 'Gemini 2.5 Pro TTS (best, slower)']];
function renderSettings() {
  const voices = Out.loadVoices();
  const custom = !TTS_MODELS.some(m => m[0] === S.ttsModel);
  $('#setBody').innerHTML = `
    <h2>Voice engine</h2>
    <div class="card">
      <div class="seg" id="sEng">${[['auto', 'AI voice + backup'], ['gemini', 'AI voice only'], ['system', 'Built-in only']].map(([v, l]) => `<button data-e="${v}" class="${S.engine === v ? 'on' : ''}">${l}</button>`).join('')}</div>
      <p class="small muted" style="margin-bottom:0">AI voice + backup uses your own cloned voice (when a book has one) or Gemini online, and drops to your phone's built-in voice if you're offline or they fail.</p>
    </div>
    <h2>Gemini</h2>
    <div class="card">
      <label class="f" style="margin-top:0">API key</label>
      <div class="row"><input id="sKey" type="password" value="${esc(S.apiKey)}" placeholder="Paste your Gemini API key" autocomplete="off"><button class="iconbtn" id="sKeyShow" title="Show">👁</button></div>
      <p class="small muted">Get a key at <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>. The key stays on this phone. Gemini speech has usage limits and may be billed on paid plans, so reading whole books uses a fair amount of quota.</p>
      <label class="f">Speech model</label>
      <select id="sModel">${TTS_MODELS.map(([v, l]) => `<option value="${v}" ${v === S.ttsModel ? 'selected' : ''}>${l}</option>`).join('')}<option value="__custom" ${custom ? 'selected' : ''}>Other…</option></select>
      <input id="sModelCustom" class="${custom ? '' : 'hidden'}" style="margin-top:8px" value="${custom ? esc(S.ttsModel) : ''}" placeholder="model id, e.g. gemini-2.5-flash-preview-tts">
      <label class="f">Book analysis model</label>
      <input id="sText" value="${esc(S.textModel)}">
      <button class="btn block" id="sTest" style="margin-top:14px">Test Gemini voice</button>
    </div>
    <h2>Your own voices (Fish Audio)</h2>
    <div class="card">
      <label class="f" style="margin-top:0">Fish Audio API key</label>
      <div class="row"><input id="sFish" type="password" value="${esc(S.fishKey)}" placeholder="Paste your Fish Audio API key" autocomplete="off"><button class="iconbtn" id="sFishShow" title="Show">👁</button></div>
      <p class="small muted">Free account and key at <a href="https://fish.audio/app/api-keys/" target="_blank">fish.audio/app/api-keys</a>. Add voices in the Voices tab, then pick one as a book's narrator.</p>
      <label class="f">Voice model</label>
      <select id="sFishModel">${[['s2.1-pro-free', 'S2.1 Pro Free (free until 30 Nov 2026)'], ['s2.1-pro', 'S2.1 Pro (paid, about $15 per 180k words)'], ['s3-pro', 'S3 Pro (paid)']].map(([v, l]) => `<option value="${v}" ${v === S.fishModel ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <p class="small muted" style="margin-bottom:0">Fish Audio's free model is offered until 30 November 2026. After that, or if it won't use your cloned voice, switch to S2.1 Pro and add credit at fish.audio (about £6 for an average novel).</p>
    </div>
    <h2>Built-in voice</h2>
    <div class="card">
      <select id="sSys"><option value="">Phone default</option>${voices.map(v => `<option value="${esc(v.name)}" ${v.name === S.sysVoice ? 'selected' : ''}>${esc(v.name)} · ${esc(v.lang)}${v.network ? ' · online' : ''}</option>`).join('')}</select>
      <div class="row" style="margin-top:12px"><button class="btn grow" id="sSysTest">Test</button>${NATIVE ? '<button class="btn grow" id="sSysMore">Get more voices</button>' : ''}</div>
      <p class="small muted" style="margin-bottom:0">For the most natural offline voice, install the “English (United Kingdom)” voice pack in Speech Services by Google and pick one of its voices here.</p>
    </div>
    <h2>Reading</h2>
    <div class="card" style="padding:0 14px">
      <div class="set"><div class="grow">Skip front &amp; back matter<div class="small muted">Covers, contents, copyright, index and similar pages are switched off when a book is added</div></div><button class="tog ${S.skipMatter ? 'on' : ''}" data-b="skipMatter"></button></div>
      <div class="set"><div class="grow">Follow along<div class="small muted">Scroll the text to keep up with the voice</div></div><button class="tog ${S.autoScroll ? 'on' : ''}" data-b="autoScroll"></button></div>
      <div class="set"><div class="grow">Text size</div><div class="slider" style="width:52%"><input type="range" id="sSize" min="14" max="28" step="1" value="${S.readSize}"><output>${S.readSize}</output></div></div>
      <div class="set"><div class="grow">Prepare ahead<div class="small muted">Gemini passages fetched in advance for gapless reading</div></div><div class="slider" style="width:42%"><input type="range" id="sPre" min="1" max="6" step="1" value="${S.prefetch}"><output>${S.prefetch}</output></div></div>
    </div>
    <p class="small muted" style="text-align:center;margin-top:28px">BookTalk ${NATIVE?.appVersion ? esc(NATIVE.appVersion()) : ''} · your books stay on this phone</p>`;
  $$('#sEng [data-e]').forEach(b => b.onclick = () => { S.engine = b.dataset.e; saveSettings(); renderSettings(); });
  $('#sKey').onchange = e => { S.apiKey = e.target.value.trim(); saveSettings(); P.gemOffUntil = 0; };
  $('#sKeyShow').onclick = () => { const k = $('#sKey'); k.type = k.type === 'password' ? 'text' : 'password'; };
  $('#sModel').onchange = e => { if (e.target.value === '__custom') { $('#sModelCustom').classList.remove('hidden'); $('#sModelCustom').focus(); } else { S.ttsModel = e.target.value; saveSettings(); $('#sModelCustom').classList.add('hidden'); P.clearCache(); P.gemOffUntil = 0; } };
  $('#sModelCustom').onchange = e => { if (e.target.value.trim()) { S.ttsModel = e.target.value.trim(); saveSettings(); P.clearCache(); P.gemOffUntil = 0; } };
  $('#sText').onchange = e => { S.textModel = e.target.value.trim() || DEFAULT_SETTINGS.textModel; saveSettings(); };
  $('#sTest').onclick = e => { S.apiKey = $('#sKey').value.trim(); saveSettings(); Preview.run({ ...moodById('story'), sample: 'Hello, I\'m your BookTalk narrator. Shall we begin?' }, 'gemini', e.currentTarget); };
  $('#sFish').onchange = e => { S.fishKey = e.target.value.trim(); saveSettings(); P.fishOffUntil = 0; };
  $('#sFishShow').onclick = () => { const k = $('#sFish'); k.type = k.type === 'password' ? 'text' : 'password'; };
  $('#sFishModel').onchange = e => { S.fishModel = e.target.value; saveSettings(); P.fishOffUntil = 0; P.clearCache(); };
  $('#sSys').onchange = e => { S.sysVoice = e.target.value; saveSettings(); };
  $('#sSysTest').onclick = e => Preview.run({ ...moodById('story'), sysVoice: '', sample: 'Hello, I\'m the built-in BookTalk voice. Shall we begin?' }, 'system', e.currentTarget);
  $('#sSysMore')?.addEventListener('click', () => NATIVE.openVoiceSettings());
  $$('[data-b]').forEach(b => b.onclick = () => { const k = b.dataset.b; S[k] = !S[k]; saveSettings(); b.classList.toggle('on', S[k]); });
  $('#sSize').oninput = e => { S.readSize = +e.target.value; e.target.nextElementSibling.textContent = S.readSize; saveSettings(); document.documentElement.style.setProperty('--read', S.readSize + 'px'); };
  $('#sPre').oninput = e => { S.prefetch = +e.target.value; e.target.nextElementSibling.textContent = S.prefetch; saveSettings(); };
}

/* ---------------- Start ---------------- */
(async function start() {
  document.documentElement.style.setProperty('--read', S.readSize + 'px');
  try { if (navigator.storage?.persist) navigator.storage.persist(); } catch {}
  await renderLibrary();
  Out.loadVoices();
  const last = LS.get('lastBook', null);
  if (last) {
    const m = await DB.get('meta', last).catch(() => null);
    if (m) {
      const [meta, content] = [m, await DB.get('content', last)];
      if (content) { P.meta = meta; P.content = content; const inc = P.included(); let ch = meta.pos?.ch ?? inc[0]; if (!meta.include[ch]) ch = inc[0]; P.loadChapter(ch, meta.pos?.p || 0); updateMini(); }
    }
  }
})();
</script>
