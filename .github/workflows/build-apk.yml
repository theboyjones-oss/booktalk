name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK (compile check)
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BookTalk-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Check signing secret
        id: sec
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Add the KEYSTORE_PASSWORD repository secret (Settings > Secrets and variables > Actions) to get the signed release APK."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release APK
        if: steps.sec.outputs.ok == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Rename APK
        if: steps.sec.outputs.ok == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk BookTalk.apk
      - name: Read app version
        if: steps.sec.outputs.ok == 'true'
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - if: steps.sec.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BookTalk-apk
          path: BookTalk.apk
      - name: Publish release
        if: steps.sec.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-build-${{ github.run_number }}
          name: BookTalk ${{ steps.ver.outputs.name }}
          make_latest: true
          files: BookTalk.apk
