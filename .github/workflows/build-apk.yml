name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK (compile check)
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Publish build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "error:|^e: |What went wrong|Execution failed|Caused by|> " build.log | head -60 > errors.txt || true
          gh release create "build-errors-${{ github.run_number }}" --prerelease --title "Build errors ${{ github.run_number }}" --notes-file errors.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BookTalk-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk BookTalk.apk
      - name: Read app version
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: BookTalk-apk
          path: BookTalk.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-build-${{ github.run_number }}
          name: BookTalk ${{ steps.ver.outputs.name }}
          make_latest: true
          files: BookTalk.apk
